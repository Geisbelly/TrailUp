name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo ref quando há um novo push — mas SÓ em pull
# request. Em `main`, cada commit tem a SUA PRÓPRIA fila.
#
# O `cancel-in-progress: false` sozinho NÃO bastava, e isto foi medido: ele
# protege a execução EM CURSO, mas o GitHub mantém no máximo uma execução
# PENDENTE por grupo e cancela as pendentes mais antigas quando uma nova chega.
# Com todos os merges em `main` dividindo o grupo `ci-refs/heads/main`, uma
# rajada deixava a primeira (em curso) e a última (pendente) e matava o meio.
#
# Em 2026-10-07, com este bloco já no lugar, quatro das últimas oito execuções
# em `main` foram canceladas — e cada uma morreu de 1 a 4 segundos depois de a
# próxima nascer:
#
#   criado 17:32:37 -> cancelado 17:32:53  (4s após a de 17:32:49 nascer)
#   criado 15:41:57 -> cancelado 15:42:06  (1s após a de 15:42:05)
#   criado 15:42:05 -> cancelado 15:43:52  (2s após a de 15:43:50)
#   criado 15:43:50 -> cancelado 15:44:03  (1s após a de 15:44:02)
#
# Duas delas eram `fix(api): advisory lock serializa as migracoes` e
# `fix(seguranca): aluno deixa de poder enviar push para outro aluno`: entraram
# em `main` sem um único job ter rodado. É assim que a `main` ficou com duas
# cabeças de alembic sem nenhum CI vermelho — e continuava sendo.
#
# Agrupar por `github.sha` em push dá a cada commit uma fila de um, então não há
# pendente para deslocar. Em PR o agrupamento segue por ref, que é o
# comportamento desejado: push novo no PR cancela a execução antiga.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detecta quais serviços mudaram para rodar apenas o necessário.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      microservice: ${{ steps.filter.outputs.microservice }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docs: ${{ steps.filter.outputs.docs }}
      brainhexpdf: ${{ steps.filter.outputs.brainhexpdf }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Mexer no proprio CI exercita TODOS os jobs. Sem esta ancora,
            # editar este arquivo roda so o job `changes` e mais nada — foi
            # assim que o passo de type-check do frontend entrou sem nunca
            # ter rodado.
            ci: &ci
              - '.github/workflows/ci.yml'
            api:
              - *ci
              - 'api/**'
              - 'scripts/verificar_implantacao.py'
              # test_env_example_sem_segredo_real.py varre os .env.example de
              # TODOS os servicos, mas mora em api/tests — sem esta linha, uma
              # chave colada em mobile/.env.example nao acionaria o guard.
              - '**/.env.example'
            microservice:
              - *ci
              - 'microservice/**'
            frontend:
              - *ci
              - 'frontend/**'
              # A jornada local cruza o cadastro web, SQL e o consumidor mobile.
              - 'scripts/testar-cadastro-atomico.mjs'
              - 'scripts/validar-cadastro-ate-material.mjs'
              - 'scripts/e2e_cadastro/**'
              - 'api/alembic/versions/**'
              - 'mobile/src/services/personalizacao/**'
              - 'mobile/src/utils/brainHex.ts'
              - 'mobile/src/models/Aluno.ts'
              - 'mobile/src/constants/brainHexProfiles.ts'
            mobile:
              - *ci
              - 'mobile/**'
            brainhexpdf:
              - *ci
              - 'brainhexpdf/**'
            docs:
              - *ci
              - 'docs/**'
              - 'scripts/verifica_encoding_docs.py'

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Encoding da documentacao (UTF-8 sem BOM, sem mojibake)
        run: python scripts/verifica_encoding_docs.py

  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instala ffmpeg (moviepy/gTTS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Instala dependências
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest
      - name: Executor Alembic em PostgreSQL descartável
        run: TRAILUP_TEST_DOCKER=1 pytest tests/test_migrations_postgres.py

  microservice:
    needs: changes
    if: ${{ needs.changes.outputs.microservice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: microservice/package-lock.json
      - run: npm ci
      - name: Type-check (tsc)
        run: npm run lint
      - name: Testes
        run: npm test

  # `brainhexpdf/` e versionado aqui (90 arquivos) e nunca teve job: os 18
  # arquivos de teste e o `tsc --noEmit` dele nao rodavam em PR nenhum. Usa
  # bun (tem `bun.lock` versionado, e nenhum package-lock), por isso o setup
  # e diferente dos outros; o `node` do setup-node serve para os scripts, que
  # chamam `node --import tsx --test`.
  brainhexpdf:
    needs: changes
    if: ${{ needs.changes.outputs.brainhexpdf == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainhexpdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          # Fixado, nao `latest`: com `--frozen-lockfile` abaixo, uma mudanca
          # de formato do lock num bun futuro derrubaria este job sem ninguem
          # ter mexido em codigo. Esta e a versao que gerou o `bun.lock`.
          # Ao subir, rode `bun install` e commite o lock junto.
          bun-version: 1.4.3
      # `--frozen-lockfile` e o que a gente quer: o job falha se o lock nao
      # casar com o package.json, em vez de resolver sozinho e esconder a
      # divergencia. Ficou fora por um tempo porque `bun.lock` estava
      # DESATUALIZADO (`d3` e `@types/d3` no package.json, ausentes do lock) e
      # o job nasceria vermelho. O lock foi regenerado com bun 1.4.3.
      - name: Instala dependencias
        run: bun install --frozen-lockfile
      - name: Type-check (tsc)
        run: bun run lint
      - name: Testes
        run: bun run test

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      # `vite build` nao checa tipo -- o esbuild so apaga as anotacoes. Sem
      # este passo, erro de tipo no frontend nao reprova PR nenhum: eram 13
      # vivendo na main.
      - name: Type-check (tsc)
        run: npm run typecheck
      - name: Testes (vitest)
        run: npm test
      - name: Transação de cadastro em PostgreSQL isolado
        run: npm run test:cadastro-banco
      - name: Chromium para os testes do cadastro
        run: npx playwright install --with-deps chromium
      - name: Jornada de cadastro (serviços simulados, sem produção)
        run: npm run test:cadastro
      - name: Jornada integrada (Auth, SMTP, PostgREST e PostgreSQL locais)
        timeout-minutes: 10
        run: npm run test:cadastro-integrado
      - name: Build
        run: npm run build

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint (expo)
        run: npm run lint
      # `expo lint` e eslint, nao checa tipo. O mobile esta com zero erro
      # hoje; o passo existe para que continue assim.
      - name: Type-check (tsc)
        run: npm run typecheck
      - name: Testes
        run: npm test
      # Grupos a parte porque compartilham estado entre si: rodados juntos com
      # a suite principal, um polui o outro. Cada `npm run` e um processo, e e
      # isso que os isola.
      #
      # `engagement` e `trail-resume` ficaram FORA daqui por um tempo: os dois
      # incluem `IAContext.battle.test.tsx`, que carregava `react-native` de
      # verdade e morria no esbuild do tsx ("Unexpected typeof", sintaxe Flow).
      # Um arquivo que nao carregava mantinha 48 testes que passam invisiveis
      # ao CI. O arquivo agora poe `react-native` no cache de require antes de
      # pedir o provider, como ja fazia com o AsyncStorage.
      - name: Testes (grupos isolados)
        run: |
          npm run test:social-chat
          npm run test:class-selection
          npm run test:presence
          npm run test:engagement
          npm run test:trail-resume
