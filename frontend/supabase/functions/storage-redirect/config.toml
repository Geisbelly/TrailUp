[functions.storage-redirect]
# Sem JWT de proposito - ver "Opcao A" no spec 2026-08-29-r2-gateway-design.md.
# O app baixa midia com FileSystem.downloadAsync(url, localUri), sem headers;
# exigir JWT daria 401 em toda midia. Desde a #195 o bucket conteudo_aluno e'
# privado: o gateway so' assina caminho vivo de vw_material_storage_paths, com
# URL que expira em <= 1 h (R2 ou Storage). Endurecer com JWT e' a Opcao B.
verify_jwt = false
