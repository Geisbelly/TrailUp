<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<title>TrailUp — Trilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Tokens preenchidos pelo JS a partir da fórmula de profileShellPalette.ts (valores pré-calculados). */
  :root{
    --bg:#0b1328; --surface:#121e3f; --elev:#192a57; --border:#28428a; --border-strong:#4d6fcb;
    --text:#f3f4f7; --accent:#6f90eb; --accent-strong:#1942b2;
    --success:#5fd99a; --success-bg:rgba(95,217,154,.14); --warning:#e0b34d; --warning-bg:rgba(224,179,77,.14);
    --danger:#e2574c; --danger-text:#f0847c; --danger-bg:#3a1e22; --danger-border:#7a3a3a; --danger-body:#f0d5d5;
    --font-title:'Cinzel', Georgia, serif; --font-body:'Inter', system-ui, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}

  /* ---------- shell: idêntico às outras telas do v1 (console-shell, 212px + topbar 68px) ---------- */
  .console-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:68px minmax(0,1fr);height:100vh;overflow:hidden}
  .console-topbar,.console-navigation{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .console-topbar{grid-column:1/-1;display:flex;align-items:center;gap:28px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
  .journey-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-size:20px}
  .journey-brand img{width:32px;height:32px}
  .journey-brand span{font-family:Georgia,serif;font-weight:700}
  .console-workspace-name{color:var(--text-subtle);font-size:12px}
  .console-account{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .console-account img.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
  .console-account-copy{display:grid;gap:2px}
  .console-account-copy strong{font-size:13px;font-weight:600}
  .console-account-copy span{font-size:11px;color:var(--text-subtle)}
  .console-icon-button{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;color:var(--text-muted);background:none;border:none;cursor:pointer;flex:none}
  .console-icon-button:hover{color:var(--text);background:var(--elev)}
  .console-icon-button img{width:20px;height:20px}
  .console-icon-button svg{width:18px;height:18px}
  .console-navigation{padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:rgba(0,0,0,.15);overflow-y:auto}
  .console-navigation a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:6px;border:1px solid transparent;color:var(--text-muted);font-size:13px;text-decoration:none}
  .console-navigation a svg{flex:none;width:18px;height:18px}
  .console-navigation a:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .console-navigation a[aria-current="page"]{color:var(--text);background:var(--accent-muted);border-color:var(--border-strong)}
  .console-navigation a[aria-current="page"] svg{color:var(--accent)}
  .console-navigation .nb{margin-left:auto;background:var(--accent);color:var(--bg);font-size:10px;font-weight:800;padding:1px 6px;border-radius:100px}
  .console-main{grid-column:2;grid-row:2;overflow:hidden;position:relative}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

  /* seletor de pré-visualização (só protótipo) */
  .preview{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px}
  .preview-label{color:var(--text-subtle);padding:0 4px 0 8px;white-space:nowrap}
  .preview select{background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:6px 10px;font:600 11px var(--font-body);cursor:pointer}
  .preview-group{display:flex;align-items:center;gap:4px}
  .preview-sep{width:1px;height:18px;background:var(--line)}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .dot[aria-pressed="true"]{border-color:var(--text)}

  /* ---------- palco ---------- */
  .stage{position:absolute;inset:0;overflow:hidden}
  .scenery{position:absolute;inset:0;z-index:0}
  .scenery img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}
  .scenery::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-a70) 0%,transparent 30%,transparent 60%,var(--bg-a85) 100%),linear-gradient(0deg,var(--bg-a70) 0%,transparent 35%),linear-gradient(180deg,var(--bg-a55) 0%,transparent 25%)}
  .glass{background:var(--surface-a82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}

  /* faixa do mundo (HUD) */
  .hud{position:absolute;top:28px;left:32px;right:352px;height:88px;z-index:10;border-radius:20px;padding:0 20px 0 18px;display:flex;align-items:center;gap:18px}
  .hud-emblem{width:48px;height:48px;object-fit:contain;flex:none;filter:drop-shadow(0 0 10px var(--accent-soft))}
  .hud-title{flex:1;min-width:0}
  .hud-title h1{font-family:var(--font-title);font-weight:700;font-size:22px;line-height:1.15;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-title .eyebrow{font-size:11px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
  .hud-title .eyebrow span{color:var(--text-subtle);letter-spacing:.04em;text-transform:none;font-weight:500}
  .hud-progress{margin-left:auto;width:260px;flex:none}
  .hud-progress .hud-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--text-subtle);margin-bottom:8px}
  .hud-progress .hud-row strong{font-size:18px;color:var(--text);font-weight:700;margin-right:4px}
  .xp-track{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
  .xp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-strong),var(--accent));box-shadow:0 0 12px var(--accent-soft)}
  .hud-sep{width:1px;height:40px;background:var(--line);flex:none}
  .hud-actions{display:flex;gap:8px;flex:none}
  .round-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);padding:0;background:var(--surface);border:1px solid var(--line)}
  .round-btn img{width:28px;height:28px;object-fit:contain}
  .round-btn:hover{border-color:var(--border-strong);background:var(--elev)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .chip svg{width:12px;height:12px}
  .chip-accent{background:var(--accent-muted);color:var(--accent);border:1px solid var(--accent-soft)}
  .chip-neutral{background:var(--elev);color:var(--text-muted)}
  .chip-warning{background:var(--warning-bg);color:var(--warning)}
  .chip-success{background:var(--success-bg);color:var(--success)}

  /* tabuleiro */
  .board{position:absolute;top:136px;left:32px;right:352px;bottom:28px;z-index:5}
  /* mapa (v2): territórios de verdade sob a estrada */
  .board.map svg.lines{z-index:0}
    .compass{position:absolute;left:4px;bottom:0;width:96px;height:96px;opacity:.28;pointer-events:none;color:var(--text)}
  .board.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
  .board.scroll.map{overflow-y:hidden;overflow-x:auto;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
  .board.scroll::-webkit-scrollbar{display:none} /* revisão 04: sem barra de rolagem dentro do mapa; rola pela roda do mouse */
  .board svg.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .node{position:absolute;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;width:170px;transform:translate(-50%,calc(-1 * var(--half)))}
  .node:focus-visible{outline:none}
  .node:focus-visible .hx{outline:2px dashed var(--text);outline-offset:8px;border-radius:24px}
  .hx{position:relative;width:var(--size);height:var(--size);transition:transform .18s ease}
  .node:hover .hx{transform:translateY(-4px) scale(1.04)}
  .hx svg{width:100%;height:100%;display:block;overflow:visible}
  .hx .glyph{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .hx .glyph .n{font-family:var(--font-title);font-weight:700;line-height:1;transform:translateY(1px)}
  .hx .glyph svg{width:34%;height:34%}
  .perso-dot{position:absolute;bottom:4%;right:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg),0 0 12px var(--accent-soft)}
  .perso-dot svg{width:12px;height:12px}
  .node.is-current .hx{filter:drop-shadow(0 0 18px var(--accent-soft)) drop-shadow(0 0 30px var(--accent-soft))}
  .node.is-current .hx::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 65%);animation:breathe 2.6s ease-in-out infinite;z-index:-1}
  @keyframes breathe{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
  .node.is-selected:not(.is-current) .hx{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 14px rgba(255,255,255,.18))}
  .sel{position:absolute;inset:-9%;pointer-events:none;opacity:0;transition:opacity .15s}
  .node.is-selected .sel{opacity:1}
  .label{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:170px}
  .label .t{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--text);text-shadow:0 1px 10px var(--bg),0 0 2px var(--bg);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node.is-locked .label .t{color:var(--text-muted)}
  .label .chip{font-size:10.5px;padding:3px 9px;border:1px solid var(--line)}
  .label .chip-accent{background:linear-gradient(var(--accent-muted),var(--accent-muted)),var(--surface);border-color:var(--accent-soft)}
  .label .chip-neutral{background:var(--surface)}
  .node.is-locked{cursor:help}
  .here{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap;padding:4px 12px 4px 4px;border-radius:999px;background:var(--accent);color:var(--bg);font-size:11.5px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .here img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--elev);box-shadow:0 0 0 2px var(--bg)}
  .here::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--accent)}
  /* árvore: rótulo ao lado */
  .node.side{flex-direction:row;width:auto;transform:translate(calc(-1 * var(--half)),calc(-1 * var(--half)));gap:12px}
  .node.side .label{margin-top:0;align-items:flex-start;text-align:left;width:150px}
  .node.side .here{left:auto;right:calc(100% + 12px);bottom:auto;top:calc(var(--half) - 18px);transform:none}
  .node.side .here::after{left:auto;right:-9px;bottom:auto;top:50%;transform:translateY(-50%);border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:7px solid var(--accent);border-right:0}
  .node.side{width:auto;align-items:flex-start}

  /* lista */
  .list{position:relative;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 96px}
  .row{position:relative;display:flex;align-items:center;gap:18px;min-height:80px;padding:10px 22px 10px 16px;border-radius:20px;background:var(--surface-a88);backdrop-filter:blur(8px);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
  .row:hover{border-color:var(--border-strong)}
  .row.is-current{border-color:var(--accent);background:linear-gradient(var(--accent-muted),var(--accent-muted)),var(--surface-a88)}
  .row.is-selected{box-shadow:0 0 0 2px var(--text)}
  .row .hx{--size:56px;flex:none}
  .row:hover .hx{transform:none}
  .row .txt{flex:1;min-width:0}
  .row .txt strong{display:block;font-size:16px;font-weight:600}
  .row .txt span{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin-top:4px}
  .row .me{width:32px;height:32px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--text)}

  /* painel de prévia */
  .panel{position:absolute;top:28px;right:32px;bottom:28px;width:300px;z-index:12;border-radius:20px;background:var(--surface-a90);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
  .panel-scroll{flex:1;overflow-y:auto;scrollbar-width:thin}
  .panel-head{padding:22px 22px 18px;display:flex;gap:14px;align-items:flex-start}
  .panel-head .hx{--size:56px;flex:none}
  .panel-head h2{font-family:var(--font-title);font-weight:700;font-size:21px;line-height:1.2;margin:6px 0 0}
  .panel-head .loc{font-size:12.5px;color:var(--text-subtle);margin-top:6px;line-height:1.45}
  .panel-sec{padding:0 22px 18px}
  .bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent))}
  .bar-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);margin-top:8px}
  .comp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .comp div{background:var(--elev);border-radius:14px;padding:12px 14px}
  .comp strong{display:block;font-size:20px;font-weight:700}
  .comp span{font-size:12px;color:var(--text-subtle)}
  .perso{background:var(--accent-muted);border:1px solid var(--accent-soft);border-radius:14px;padding:14px}
  .perso p{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--text-muted)}
  .locked-box{display:flex;flex-direction:column;gap:10px}
  .locked-box .title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
  .locked-box p{margin:0;font-size:13px;color:var(--text-subtle);line-height:1.5}
  .req{background:var(--elev);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:500;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
  .accordion{border-top:1px solid var(--line);margin:0 22px}
  .accordion > button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:14px 0;font-size:13.5px;font-weight:600;cursor:pointer}
  .accordion > button svg{transition:transform .16s}
  .accordion[data-open="true"] > button svg{transform:rotate(180deg)}
  .acc-list{display:none;padding-bottom:12px}
  .accordion[data-open="true"] .acc-list{display:flex;flex-direction:column;gap:2px}
  .acc-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:12px;background:none;border:0;cursor:pointer;font-size:13px;text-align:left}
  .acc-item:hover{background:var(--elev)}
  .acc-item[aria-current="true"]{background:var(--accent-muted)}
  .acc-item .hx{--size:24px;flex:none}
  .acc-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel-foot{padding:18px 22px;border-top:1px solid var(--line)}
  .btn{text-decoration:none;height:44px;padding:0 22px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid transparent;transition:transform .14s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:var(--bg);font-weight:700}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-secondary{background:transparent;border-color:var(--border);color:var(--text)}
  .btn-secondary:hover{background:var(--elev)}
  .btn-block{width:100%;height:50px}
  .btn-sm{height:34px;padding:0 14px;font-size:13px}
  .ghost{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0}

  /* mentor */
  .fab{position:absolute;right:368px;bottom:44px;z-index:20;width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 12px 30px rgba(0,0,0,.45);display:grid;place-items:center}
  .fab img{width:44px;height:44px;border-radius:50%;object-fit:cover}
  .fab .ping{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
  .mentor{position:absolute;right:368px;bottom:112px;z-index:22;width:380px;max-height:min(76vh,620px);border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column}
  .mentor-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);border-top:3px solid var(--accent)}
  .mentor-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}
  .mentor-head strong{font-family:var(--font-title);font-size:14px;display:block}
  .mentor-head span{font-size:11px;color:var(--text-subtle)}
  .mentor-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .bubble{background:var(--elev);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;line-height:1.5;max-width:90%}
  .mentor-note{font-size:11.5px;color:var(--text-subtle);padding:0 18px 10px;line-height:1.45}
  .mentor-input{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
  .mentor-input input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:9px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
  .mentor-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .send{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);display:grid;place-items:center;cursor:pointer}
  .close{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--elev);border:0;display:grid;place-items:center;cursor:pointer;color:var(--text-muted)}

  /* estados de página */
  .center-state{position:absolute;inset:0 0 0 0;z-index:8;display:flex;align-items:center;justify-content:center;padding:40px}
  .empty-card{width:520px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:64px 40px;border-radius:20px}
  .empty-card h2{font-family:var(--font-title);font-weight:700;font-size:24px;margin:0}
  .empty-card p{margin:0;font-size:15px;line-height:1.6;color:var(--text-subtle);max-width:480px}
  .empty-card .note{font-size:13px}
  .error-card{width:560px;display:flex;gap:20px;padding:30px;border-radius:20px;background:var(--danger-bg);border:1px solid var(--danger-border)}
  .error-card .ic{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(224,87,76,.18);display:grid;place-items:center;color:var(--danger-text)}
  .error-card h2{font-size:16px;font-weight:700;margin:0}
  .error-card p{font-size:14px;line-height:1.6;color:var(--danger-body);margin:6px 0 16px}
  .error-card .btn-secondary{border-color:var(--danger-border)}
  .skel{background:linear-gradient(90deg,var(--surface) 0%,var(--elev-hi) 50%,var(--surface) 100%);background-size:600px 100%;animation:shimmer 1.4s linear infinite;border-radius:14px}
  @keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
  .loading-msg{position:absolute;left:calc((100% - 384px) / 2 + 8px);top:calc(50% + 56px);transform:translate(-50%,-50%);z-index:9;display:flex;align-items:center;gap:12px;padding:18px 24px;border-radius:16px;border:1px dashed var(--line);background:var(--surface-a82);font-size:14px;color:var(--text-subtle);white-space:nowrap}

/* ================= hexágono (SVG) ================= */
// hexágono de ponta para cima, cantos arredondados
function hexPath(cx,cy,R,rc){
  const v=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);v.push([cx+R*Math.cos(a),cy+R*Math.sin(a)])}
  let d='';for(let i=0;i<6;i++){const p=v[i],pr=v[(i+5)%6],nx=v[(i+1)%6];
    const t=rc/R;const a=[p[0]+(pr[0]-p[0])*t,p[1]+(pr[1]-p[1])*t],b=[p[0]+(nx[0]-p[0])*t,p[1]+(nx[1]-p[1])*t];
    d+=(i?'L':'M')+a[0].toFixed(2)+' '+a[1].toFixed(2)+' Q'+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '+b[0].toFixed(2)+' '+b[1].toFixed(2)+' '}
  return d+'Z';
}
const HEX_OUT=hexPath(50,50,46,9), HEX_IN=hexPath(50,50,37,7), HEX_SEL=hexPath(50,50,53,11);

  done:   {grad:'g-done',   stroke:'var(--accent-hi)',     sw:2,   inner:'rgba(255,255,255,.28)', glyph:'var(--bg)',      shine:true},
  current:{grad:'g-current',stroke:'var(--text)',          sw:3,   inner:'rgba(255,255,255,.45)', glyph:'var(--bg)',      shine:true},
  open:   {grad:'g-open',   stroke:'var(--accent)',        sw:2,   inner:'var(--accent-soft)',    glyph:'var(--text)',    shine:false},
  locked: {grad:'g-locked', stroke:'var(--border)',        sw:2,   inner:'rgba(255,255,255,.05)', glyph:'var(--inactive)',shine:false, dash:'5 5'},
};
function hexSVG(t,size,opts={}){
  const S=HSTYLE[t.st];
  const glyph = t.st==='done'?ICON.check : t.st==='locked'?ICON.lock : `<span class="n num" style="font-size:${Math.round(size*.36)}px">${t.n}</span>`;
  return `<span class="hx" style="--size:${size}px">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      ${opts.sel?`<path class="sel" d="${HEX_SEL}" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="3 5"/>`:''}
      <path d="${HEX_OUT}" fill="url(#${S.grad})" stroke="${S.stroke}" stroke-width="${S.sw}" ${S.dash?`stroke-dasharray="${S.dash}"`:''}/>
      <path d="${HEX_IN}" fill="none" stroke="${S.inner}" stroke-width="1.5"/>
      ${S.shine?`<path d="${HEX_IN}" fill="url(#g-shine)" opacity=".55"/>`:''}
    </svg>
    <span class="glyph" style="color:${S.glyph}">${glyph}</span>
    ${t.perso&&opts.badge?`<span class="perso-dot" title="Módulo personalizado">${ICON.spark}</span>`:''}

}

/* --- mapa: serpentina (ida e volta), todos os tópicos à vista --- */
function snakeLayout(W,H,minBand=300){
  const cols=W>=700?4:3, colW=W/cols, rows=Math.ceil(TOPICS.length/cols);
  // cada fileira ocupa uma faixa igual da altura; o hexágono fica um pouco acima do meio da faixa
  // (em cima dele só há o marcador, embaixo há nome + chip), então o bloco visual fica centrado.
  const band=Math.max(minBand,H/rows);
  return TOPICS.map((t,i)=>{const r=Math.floor(i/cols),c=i%cols,col=r%2?cols-1-c:c;return {n:t.n,x:colW*(col+.5),y:band*r+band*.5-12,r,cols,colW}});
}
// contorno orgânico de um país (mesma ideia do buildCountryPath do MapaViewStable, com bordas suaves)
function blobPath(cx,cy,rx,ry,seed,lo=.74,amp=.36){
  const N=14,pts=[];
  for(let i=0;i<N;i++){const a=Math.PI*2*i/N,r=Math.sin((i+1)*12.9898+seed*78.233)*43758.5453,k=lo+amp*(r-Math.floor(r));pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2],m0=mid(pts[N-1],pts[0]);
  let d=`M${m0[0].toFixed(1)} ${m0[1].toFixed(1)}`;
  for(let i=0;i<N;i++){const p=pts[i],m=mid(p,pts[(i+1)%N]);d+=` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`}
  return d+'Z';
}
// cores do território = tabela de MapaViewStable (prompt §2.5)
const TERR={
  done:   {fill:'color-mix(in srgb,var(--accent-strong) 62%,var(--bg))',stroke:'var(--accent)',       sw:2},
  current:{fill:'color-mix(in srgb,var(--accent) 48%,var(--bg))',       stroke:'var(--text)',         sw:3},
  open:   {fill:'color-mix(in srgb,var(--accent) 16%,var(--surface))',  stroke:'var(--border-strong)',sw:2},
  locked: {fill:'color-mix(in srgb,var(--surface) 92%,var(--bg))',      stroke:'var(--border)',       sw:2, dash:'6 6'},
};
/* --- mapa (v2): cada tópico é um país; a estrada (a serpentina do v1) liga as capitais --- */
// O continente é uma grade (colunas × fileiras) recortada em países que DIVIDEM fronteira, como num mapa:
// cada borda é gerada uma vez e usada pelos dois vizinhos, então nenhum país invade o outro e não sobra
// buraco entre eles. A altura é a que o conteúdo pede; o tabuleiro rola em vez de cortar a última fileira.
let MAP_BAND=228; const MAP_TOP=28, MAP_BOTTOM=84, MAP_SIDE=.03, MAP_MIN_CW=190, MAP_COLS=4; // MAP_BOTTOM: folga sob o botão do guia
// revisão 04: o mapa cabe na altura do quadro (sempre 4 colunas × 2 fileiras; a fileira encolhe entre 140 e 228px) e só rola na horizontal,
// quando o quadro é estreito demais para os países terem pelo menos MAP_MIN_CW de largura.
const mapHash=(a,b)=>{const r=Math.sin(a*12.9898+b*78.233)*43758.5453;return r-Math.floor(r)};
function mapLayout(W){
  const cols=MAP_COLS, rows=Math.ceil(TOPICS.length/cols), x0=W*MAP_SIDE, cw=W*(1-2*MAP_SIDE)/cols;
  const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push({c,r});
  const nodes=TOPICS.map((t,i)=>{const r=Math.floor(i/cols),k=i%cols,c=r%2?cols-1-k:k;
    return {n:t.n,r,c,cols,colW:cw,x:x0+cw*(c+.5)+Math.sin((i+1)*.82)*cw*.04,y:MAP_TOP+MAP_BAND*r+MAP_BAND*.36+Math.cos((i+1)*1.3)*8}});
  return {cols,rows,x0,cw,cells,nodes};
}
function mapCellPath(L,c,r){
  const {cols,rows,x0,cw}=L;
  const corner=(i,j)=>{ // vértice compartilhado: por dentro ele se desloca bastante; nas quinas da costa ele recua (continente arredondado)
    const inX=i>0&&i<cols, inY=j>0&&j<rows;
    let x=x0+i*cw+(inX?(mapHash(i,j)-.5)*cw*.3:0), y=MAP_TOP+j*MAP_BAND+(inY?(mapHash(j+7,i+3)-.5)*MAP_BAND*.22:0);
    if(!inX&&!inY){x+=(i?-1:1)*cw*.16;y+=(j?-1:1)*MAP_BAND*.14}
    return [x,y];
  };
  const edge=(A,B,seed,coast)=>{ // borda sinuosa e suave (soma de senos); gerada sempre na mesma direção, então os dois vizinhos usam a mesma
    const dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,out=[],k=coast?1.35:1;
    const a=(mapHash(seed,1)-.5)*.22*k,b=(mapHash(seed,2)-.5)*.14*k,c=(mapHash(seed,3)-.5)*.05*k;
    for(let n=1;n<16;n++){const t=n/16,o=len*(a*Math.sin(Math.PI*t)+b*Math.sin(2*Math.PI*t)+c*Math.sin(5*Math.PI*t));out.push([A[0]+dx*t+nx*o,A[1]+dy*t+ny*o])}

  };
  const H=(i,j)=>edge(corner(i,j),corner(i+1,j),i*31+j*7+1,j===0||j===rows); // borda horizontal
  const V=(i,j)=>edge(corner(i,j),corner(i,j+1),i*17+j*43+5,i===0||i===cols); // borda vertical
  const pts=[corner(c,r),...H(c,r),corner(c+1,r),...V(c+1,r),corner(c+1,r+1),...H(c,r+1).reverse(),corner(c,r+1),...V(c,r).reverse()];
  return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z';
}
function mapBoard(W0,H){
  const cols0=MAP_COLS, rows0=Math.ceil(TOPICS.length/cols0);
  MAP_BAND=Math.max(140,Math.min(228,(H-MAP_TOP-MAP_BOTTOM)/rows0));
  const W=Math.max(W0,Math.ceil(cols0*MAP_MIN_CW/(1-2*MAP_SIDE)));
  const L=mapLayout(W), P=L.nodes, cur=TOPICS.findIndex(t=>t.st==='current');
  const cont=Math.max(H,MAP_TOP+L.rows*MAP_BAND+MAP_BOTTOM);
  const seg=(a,b)=>{
    if(a.r===b.r){const dx=(b.x-a.x)/2,w=(a.r%2?-1:1)*18;return `M${a.x} ${a.y} C${a.x+dx} ${a.y+w},${b.x-dx} ${b.y-w},${b.x} ${b.y}`}
    const out=(a.r%2?-1:1)*a.colW*.46;return `M${a.x} ${a.y} C${a.x+out} ${a.y},${b.x+out} ${b.y},${b.x} ${b.y}`; // virada de fileira, dentro do país
  };
  const topicAt=(c,r)=>{const i=P.findIndex(p=>p.c===c&&p.r===r);return i<0?null:TOPICS[i]};
  let svg=`<svg class="lines" width="${W}" height="${cont}" viewBox="0 0 ${W} ${cont}">`;
  // mar: paralelos e meridianos, como o globo do app
  for(let i=1;i<8;i++){const y=cont*i/8,w=6+i*2;svg+=`<path d="M0 ${y} C${W*.25} ${y+w},${W*.5} ${y-w},${W*.75} ${y+w} S${W} ${y}" fill="none" stroke="var(--border-strong)" stroke-opacity=".14"/>`}
  for(let i=1;i<8;i++){const x=W*i/8,b=(i<4?1:-1)*W*.03;svg+=`<path d="M${x} 0 C${x+b} ${cont*.3},${x+b} ${cont*.7},${x} ${cont}" fill="none" stroke="var(--border-strong)" stroke-opacity=".1"/>`}
  // costa: halo e sombra do continente inteiro
  const all=L.cells.map(({c,r})=>mapCellPath(L,c,r)).join(' ');
  svg+=`<path d="${all}" fill="rgba(0,0,0,.4)" transform="translate(0 12)"/>`;
  svg+=`<path d="${all}" fill="none" stroke="var(--border-strong)" stroke-opacity=".35" stroke-width="14" stroke-linejoin="round"/>`;
  // países: território + fronteira na cor do fundo; célula sem tópico vira terra sem nome

  });

  svg+=`<path d="${road}" fill="none" stroke="var(--bg-a55)" stroke-width="16" stroke-linecap="round"/>`;
  for(let i=0;i<P.length-1;i++){
    const d=seg(P[i],P[i+1]);
    if(i<cur) svg+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 0 8px var(--accent))"/>`;

    else svg+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round" style="filter:drop-shadow(0 0 6px var(--accent))"/>`;
  }

  const compass=`<svg class="compass" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="2 4"/><path d="M50 6 L56 50 L50 94 L44 50Z M6 50 L50 44 L94 50 L50 56Z" fill="currentColor" fill-opacity=".45"/><path d="M50 6 L56 50 L44 50Z" fill="currentColor"/></svg>`;
  return `<div style="position:relative;width:${W}px;height:${cont}px">${svg}${compass}${P.map((p,i)=>nodeHTML(TOPICS[i],p.x,p.y,68,false)).join('')}</div>`;
}

/* --- árvore: níveis de cima para baixo, rótulo ao lado --- */
function treeBoard(W,H){
  // Distância fixa entre níveis: antes ela encolhia para caber na tela (≈57px numa tela de 768px de altura)
  // e cada tópico (hexágono + nome em 2 linhas + selo, ≈70px) invadia o de baixo. Agora a árvore cresce e o tabuleiro rola.
  const pitch=118, top0=40, pos={}, cont=Math.max(H,top0+TREE_LEVELS.length*pitch+60); H=cont;
  TREE_LEVELS.forEach((lvl,r)=>lvl.forEach((n,i)=>{pos[n]={x:W/2-90+(i-(lvl.length-1)/2)*240,y:top0+r*pitch+pitch/2}}));
  let svg=`<svg class="lines" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  TREE_EDGES.forEach(([a,b])=>{const p=pos[a],q=pos[b],my=(p.y+q.y)/2;const done=topic(a).st==='done'&&topic(b).st!=='locked';
    svg+=`<path d="M${p.x} ${p.y+26} C${p.x} ${my},${q.x} ${my},${q.x} ${q.y-26}" fill="none" stroke="${done?'var(--accent)':'var(--border-strong)'}" stroke-opacity="${done?1:.5}" stroke-width="${done?3:2}" ${done?'style="filter:drop-shadow(0 0 5px var(--accent))"':'stroke-dasharray="2 7" stroke-linecap="round"'}/>`});
  svg+='</svg>';
  return `<div style="position:relative;height:${H}px">${svg}${TOPICS.map(t=>nodeHTML(t,pos[t.n].x,pos[t.n].y,60,true)).join('')}</div>`;
}

      <div class="title">${ICON.lock.replace('<svg ','<svg width="18" height="18" ')} ${t.t} está bloqueado</div>

      <div class="req">${ICON.lock.replace('<svg ','<svg width="16" height="16" style="flex:none;margin-top:2px;color:var(--text-subtle)" ')}<span>Pré-requisitos: ${t.req.map(n=>topic(n).t).join(' e ')}.</span></div>
      <button class="ghost" data-select="${t.req[0]}" style="align-self:flex-start">Ver ${topic(t.req[0]).t} →</button></div>`;
  } else {
    body=`<div class="panel-sec">
        <div class="bar" role="progressbar" aria-valuenow="${t.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do módulo"><i style="width:${t.pct}%"></i></div>
        <div class="bar-label"><span class="num">${t.pct}% do módulo</span><span>${t.st==='open'?'Ainda não iniciado':t.st==='done'?'Concluído':''}</span></div></div>
      <div class="panel-sec comp"><div><strong class="num">${t.c}</strong><span>conteúdos</span></div><div><strong class="num">${t.a}</strong><span>atividades</span></div></div>
      ${t.perso?`<div class="panel-sec"><div class="perso"><span class="chip chip-accent">${ICON.spark}Módulo personalizado</span><p>${JUSTIFICATIVA}</p><button class="ghost" data-open-mentor style="margin-top:10px">Conversar com ${guia} →</button></div></div>`:''}`;
  }
  const action=t.st==='current'?`<a class="btn btn-primary btn-block" href="04-topico.html">Continuar ${ICON.arrow}</a>`
    :t.st==='open'?`<a class="btn btn-primary btn-block" href="04-topico.html">Iniciar tópico ${ICON.arrow}</a>`
    :t.st==='done'?`<a class="btn btn-secondary btn-block" href="04-topico.html">Revisar tópico</a>`:'';
  return `<aside class="panel" id="panel" aria-label="Tópico selecionado" aria-live="polite">
    <div class="panel-scroll">
      <div class="panel-head">${hexSVG(t,56,{})}<div><div class="eyebrow">${eyebrow}</div><h2>${t.t}</h2>${isMap?`<div class="loc">${t.pais} · Capital: ${t.cap}</div>`:''}</div></div>
      ${body}
      <div class="accordion" data-open="${accOpen}">
        <button type="button" data-toggle-acc aria-expanded="${accOpen}">Todos os módulos (8)${ICON.chev}</button>
        <div class="acc-list" role="list" aria-label="Lista de módulos da trilha">${TOPICS.map(x=>`<button class="acc-item" data-select="${x.n}" aria-current="${selected===x.n}">${hexSVG(x,24,{})}<span class="nm">${x.t}</span><span class="num" style="color:var(--text-subtle);font-size:12px">${x.st==='locked'?'':x.pct+'%'}</span></button>`).join('')}</div>
      </div>
    </div>
    ${action?`<div class="panel-foot">${action}</div>`:''}
  </aside>`;
}

function mentorHTML(){
  const P=PROFILES[profileKey],speaker=P.chat?P.guardian:'Guia',g=P.guardian;
  const opening=profileKey==='socializer'?'Vou priorizar a conversa para explicar personalização, progresso e estratégia sem entregar respostas.':'Estou acompanhando você. Se travar, eu apareço com uma dica.';
  return `${mentorOpen?`<section class="mentor" aria-label="${g} na trilha">
    <div class="mentor-head"><img src="assets/rosto-${profileKey}.png" alt="" /><div><strong>${g} na trilha</strong><span>${speaker}</span></div><button class="close" aria-label="Fechar" data-close-mentor>${ICON.x}</button></div>
    <div class="mentor-body"><div class="bubble">${opening}</div><div class="bubble"><strong style="display:block;margin-bottom:4px">Equações do 1º grau</strong>${JUSTIFICATIVA} Se quiser, eu explico essa decisão.</div>
      <div style="display:flex;gap:8px"><span class="chip chip-neutral">Personalização</span><span class="chip chip-neutral">Métricas</span></div></div>
    <div class="mentor-note">Eu posso orientar, resumir métricas e explicar a personalização, mas não entrego respostas de atividades.</div>
    <div class="mentor-input"><input placeholder="Pergunte sobre a trilha, métricas ou personalização" aria-label="Mensagem para o guia" /><button class="send" aria-label="Enviar mensagem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button></div>
  </section>`:''}
  <button class="fab" aria-label="${mentorOpen?'Fechar':'Abrir'} ${g} na trilha${cueOpen?' (1 mensagem nova)':''}" title="${g} na trilha" data-toggle-mentor><img src="assets/rosto-${profileKey}.png" alt="" />${cueOpen&&!mentorOpen?'<span class="ping"></span>':''}</button>`;
}

function render(){
  renderPreview();
  document.getElementById('scenery').src=`assets/${mode()==='mapa'?'map':'trail'}-${profileKey}.webp`;
  const v=document.getElementById('view');
  document.getElementById('scenery').style.filter=(pageState==='turmas'||pageState==='noclass')?'brightness(.45)':'';
  if(pageState==='empty'){v.innerHTML=`<div class="center-state"><div class="empty-card glass"><span style="color:var(--text-subtle)">${ICON.map}</span><h2>Sem trilhas</h2><p>Nenhuma trilha disponível no momento.</p><p class="note">Quando sua professora publicar a trilha, ela aparece aqui.</p></div></div>`;return}
  if(pageState==='error'){v.innerHTML=`<div class="center-state"><div class="error-card" role="alert"><span class="ic">${ICON.alert}</span><div><h2>Não foi possível carregar sua trilha</h2><p>Verifique sua conexão e tente novamente.</p><button class="btn btn-secondary btn-sm" data-set-state="data">${ICON.retry}Tentar novamente</button></div></div></div>`;return}
  if(pageState==='noclass'){v.innerHTML=`<div class="center-state"><div class="empty-card glass"><span style="color:var(--text-subtle)">${ICON.school}</span><h2>Você ainda não está em uma turma</h2><p>Peça o código de matrícula para sua professora.</p><button class="btn btn-secondary">Sair da conta</button></div></div>`;return}
  if(pageState==='turmas'){
    const T=[['Matemática',56],['Ciências',12],['História',0]];
    v.innerHTML=`<div class="center-state"><div class="turmas"><h2>Escolha sua turma</h2><p>Você está em 3 turmas. Escolha por onde continuar.</p>
      <div class="turma-grid">${T.map(([m,p])=>`<article class="turma glass"><span class="chip ${p?'chip-accent':'chip-neutral'}" style="align-self:flex-start;text-transform:uppercase;letter-spacing:.06em">${m}</span><h3>${m}</h3><div class="m">6º ano B · Prof. Helena Duarte</div>
      <div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div><div class="bar-label"><span class="num">${p?p+'% concluído':'Não iniciada'}</span></div>
      <button class="btn btn-secondary" aria-label="Entrar em ${m}, turma 6º ano B, com Prof. Helena Duarte" data-set-state="data">Entrar na turma</button></article>`).join('')}</div>
      <button class="ghost" style="margin-top:18px">↻ Atualizar turmas</button></div></div>`;return}

  if(pageState==='sel-locked')selected=7;
  if(pageState==='sel-done')selected=3;
  const loading=pageState==='loading';
  v.innerHTML = (loading?`<section class="hud glass"><div class="skel" style="width:48px;height:48px;border-radius:50%"></div><div><div class="skel" style="height:11px;width:200px"></div><div class="skel" style="height:24px;width:300px;margin-top:10px"></div></div><div class="skel" style="margin-left:auto;height:30px;width:250px"></div></section>`:hudHTML())
    + `<div class="board scroll ${mode()==='mapa'?'map':''}" id="board"></div>`
    + (loading?`<aside class="panel" style="padding:22px;gap:14px"><div class="skel" style="height:56px;width:56px"></div><div class="skel" style="height:24px;width:240px"></div><div class="skel" style="height:8px;width:100%;margin-top:10px"></div><div class="skel" style="height:70px;width:100%"></div><div class="skel" style="height:90px;width:100%"></div><div class="skel" style="height:50px;width:100%;margin-top:auto;border-radius:999px"></div></aside><div class="loading-msg" role="status">${ICON.star}<span><strong>Carregando trilhas</strong> · Preparando sua jornada.</span></div>`
              : panelHTML()+mentorHTML());
  layoutBoard(loading);
}
function layoutBoard(loading){
  const board=document.getElementById('board'); if(!board)return;
  const W=board.clientWidth,H=board.clientHeight,m=mode();
  if(loading){
    const P=snakeLayout(W,H);
    board.innerHTML=P.map((p,i)=>`<div class="skel" style="position:absolute;left:${p.x-44}px;top:${p.y-44}px;width:88px;height:88px;clip-path:path('${hexPath(44,44,41,8)}');border-radius:0;animation-delay:${i*.12}s"></div>`).join('');return;
  }
  board.innerHTML = m==='mapa'?mapBoard(W,H):m==='arvore'?treeBoard(W,H):listBoard();
  bindBoard();
  if(m==='lista'){const c=board.querySelector('.row.is-current');c&&(board.scrollTop=c.offsetTop-H/2+40)}
  if(m==='arvore'){const c=board.querySelector('.node.is-current');c&&(board.scrollTop=Math.max(0,c.offsetTop-H/2))}
  if(m==='mapa'){const c=board.querySelector('.node.is-current');c&&(board.scrollLeft=Math.max(0,c.offsetLeft-W/2))}
}

/* ================= interação ================= */
function select(n,focus){
  selected=n; const board=document.getElementById('board'),st=board?board.scrollTop:0,sl=board?board.scrollLeft:0;
  render(); const b2=document.getElementById('board'); if(b2){b2.scrollTop=st;b2.scrollLeft=sl}
  if(focus){const el=document.querySelector(`#board [data-node="${n}"]`);el&&el.focus({preventScroll:false})}
}
document.addEventListener('wheel',e=>{const b=e.target.closest('#board.map');if(!b||b.scrollWidth<=b.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();b.scrollLeft+=e.deltaY},{passive:false});
function openTopic(n){const t=topic(n);if(t.st==='locked'){openLocked(t);return}location.href='04-topico.html'}
function bindBoard(){
  document.querySelectorAll('#board [data-node]').forEach(el=>{
    const n=+el.dataset.node;
    el.addEventListener('click',()=>select(n,false));
    el.addEventListener('dblclick',()=>openTopic(n));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();openTopic(n)}
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(Math.min(8,n+1),true)}
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(Math.max(1,n-1),true)}
    });
  });
}

/* ================= modais ================= */
function modal(html){const m=document.getElementById('modals');m.innerHTML=`<div class="overlay" data-overlay>${html}</div>`;const f=m.querySelector('[data-autofocus]')||m.querySelector('button');f&&f.focus()}
function closeModal(){document.getElementById('modals').innerHTML=''}
function openLocked(t){
  modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lk"><div class="modal-head"><h2 id="lk">Conteúdo selado</h2><button class="close" aria-label="Fechar" data-close>${ICON.x}</button></div>
  <div class="modal-body sealed">${hexSVG(t,84,{})}<div class="eyebrow" style="margin-top:6px">Conteúdo selado</div><h3>${t.t} está bloqueado</h3><p>Conclua os módulos anteriores para liberar este conteúdo.</p>
  <div class="req" style="width:100%;text-align:left">${ICON.lock.replace('<svg ','<svg width="16" height="16" style="flex:none;margin-top:2px" ')}<span>Pré-requisitos: ${t.req.map(n=>topic(n).t).join(' e ')}.</span></div>
  <button class="btn btn-primary btn-block" data-close data-autofocus style="margin-top:8px">Entendi</button></div></div>`);
}
const BAG=[
  {tag:'MEU ITEM',o:'Salvos',img:'object-book.png',h:'Resumo — Frações equivalentes',p:'Duas frações são equivalentes quando representam a mesma parte do todo: 1/2 = 2/4 = 4/8.'},
  {tag:'ANOTAÇÃO',o:'Salvos',img:'object-book.png',h:'Regra de sinais',p:'Sinais iguais dão positivo; sinais diferentes dão negativo. Vale para multiplicação e divisão.'},
  {tag:'MEU ITEM',o:'Salvos',img:'object-hint.png',h:'Pergunta: o que é incógnita?',p:'Clique para virar.'},
  {tag:'MEU ITEM',o:'Comprados',img:'object-hint.png',h:'Poção de dica',p:'Revela uma dica na próxima atividade.'},
  {tag:'MEU ITEM',o:'Gerados',img:'object-map.png',h:'Mapa mental de Equações',p:'Gerado para o seu perfil a partir de Equações do 1º grau.'},
];
let bagTab='Todos';
function openBag(){
  const tabs=['Todos','Salvos','Comprados','Gerados'],items=BAG.filter(b=>bagTab==='Todos'||b.o===bagTab);
  modal(`<div class="modal lg" role="dialog" aria-modal="true" aria-labelledby="bg"><div class="modal-head"><span class="ic" style="background:none"><img src="assets/object-bag.png" alt="" /></span><div><div class="eyebrow">Seu inventário</div><h2 id="bg">Bag</h2></div><button class="close" aria-label="Fechar Bag" data-close>${ICON.x}</button></div>
  <div class="modal-body"><div class="bag-bar"><label class="search">${ICON.search}<input class="input" placeholder="Buscar na Bag" aria-label="Buscar na Bag" /></label>
  <div class="seg" role="group" aria-label="Filtrar itens">${tabs.map(x=>`<button aria-pressed="${bagTab===x}" data-bag-tab="${x}">${x}</button>`).join('')}</div>
  <button class="btn btn-primary btn-sm" style="margin-left:auto">+ Novo item</button></div>
  <div class="bag-grid">${items.map(b=>`<article class="bag-card"><div class="top"><span class="chip chip-neutral" style="font-size:10.5px">${b.tag}</span><img src="assets/${b.img}" alt="" /></div><h4>${b.h}</h4><p>${b.p}</p>
  <div class="acts"><button aria-label="Compartilhar item da Bag" title="Compartilhar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  <button aria-label="Editar item da Bag" title="Editar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="del" aria-label="Excluir item da Bag" title="Excluir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div></article>`).join('')}</div></div></div>`);
}
const GUIDE=[
  ['hud','Progresso da trilha','A barra mostra quanto da trilha você já concluiu, somando o material da professora e o personalizado.'],
  ['board','A jornada','A trilha aparece do jeito do seu perfil: no mapa, cada tópico é um país; na árvore, um galho; na lista, uma linha. Clique para ver a prévia; clique duas vezes para entrar.'],
  ['panel','Tópico selecionado','Aqui aparecem o progresso, o que tem no tópico e por que ele foi personalizado para você.'],
  ['guideBtn','Guia da trilha','Volte aqui sempre que quiser rever como a trilha funciona para o seu perfil.'],
];
let gStep=0;
function showGuide(){
  document.querySelectorAll('.guide-target').forEach(e=>e.classList.remove('guide-target'));
  const [id,h,p]=GUIDE[gStep],el=document.getElementById(id);el&&el.classList.add('guide-target');
  const r=el.getBoundingClientRect();let left=Math.min(innerWidth-380,Math.max(16,r.left)),top=r.bottom+14;
  if(top>innerHeight-220)top=Math.max(16,r.top+40);if(id==='panel'){left=r.left-380;top=r.top+40}if(id==='board'){left=r.left+r.width/2-180;top=r.top+r.height/2-80}
  const last=gStep===GUIDE.length-1;
  document.getElementById('modals').innerHTML=`<div class="guide-dim" data-guide-skip></div><div class="guide-pop" role="dialog" aria-modal="true" aria-labelledby="gt" style="left:${left}px;top:${top}px">
    <div class="eyebrow">Guia tutorial da trilha</div><h3 id="gt">${h}</h3><p>${gStep===0?'Este guia resume como a trilha aparece para o seu perfil hoje. ':''}${p}</p>
    <div class="foot"><span class="steps num">${gStep+1} de ${GUIDE.length}</span><button class="ghost" data-guide-skip style="color:var(--text-subtle)">Pular</button>
    ${gStep>0?'<button class="btn btn-secondary btn-sm" data-guide-prev>Voltar</button>':''}<button class="btn btn-primary btn-sm" data-guide-next>${last?'Começar':'Próximo'}</button></div></div>`;
  document.querySelector('[data-guide-next]').focus();
}
function endGuide(){document.querySelectorAll('.guide-target').forEach(e=>e.classList.remove('guide-target'));closeModal()}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-set-state],[data-profile],[data-select],[data-toggle-acc],[data-open],[data-close],[data-overlay],[data-open-mentor],[data-toggle-mentor],[data-close-mentor],[data-bag-tab],[data-guide-next],[data-guide-prev],[data-guide-skip]');
  if(!t)return;
  if(t.dataset.setState!==undefined){pageState=t.dataset.setState;if(pageState==='data'||pageState==='stale')selected=5;render()}
  else if(t.dataset.profile){profileKey=t.dataset.profile;applyTheme();render()}
  else if(t.dataset.select){select(+t.dataset.select,true)}
  else if(t.hasAttribute('data-toggle-acc')){accOpen=!accOpen;render()}
  else if(t.dataset.open==='bag')openBag();
  else if(t.dataset.open==='guide'){gStep=0;showGuide()}
  else if(t.hasAttribute('data-close'))closeModal();
  else if(t.hasAttribute('data-overlay')&&e.target===t)closeModal();
  else if(t.hasAttribute('data-open-mentor')||t.hasAttribute('data-toggle-mentor')){mentorOpen=!mentorOpen;cueOpen=false;render()}
  else if(t.hasAttribute('data-close-mentor')){mentorOpen=false;render()}
  else if(t.dataset.bagTab){bagTab=t.dataset.bagTab;openBag()}
  else if(t.hasAttribute('data-guide-next')){if(gStep<GUIDE.length-1){gStep++;showGuide()}else endGuide()}
  else if(t.hasAttribute('data-guide-prev')){gStep--;showGuide()}
  else if(t.hasAttribute('data-guide-skip'))endGuide();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.guide-pop'))endGuide();else if(document.getElementById('modals').innerHTML)closeModal();else if(mentorOpen){mentorOpen=false;render()}}});
// portões (mobile/src/utils/portoes.ts): Social abre no 1º conteúdo, Ranking no 1º tópico concluído
function aplicarPortoes(){
  const travar=pageState==='gate-new';
  [['06-social.html','social'],['05-ranking.html','rank']].forEach(([href,f])=>{
    const a=document.querySelector(`.console-navigation a[href="${href}"]`); if(!a)return;
    a.classList.toggle('nav-locked',travar); a.dataset.portao=travar?f:'';
    let l=a.querySelector('.nav-lock'); if(travar&&!l)a.insertAdjacentHTML('beforeend','<svg class="nav-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'); if(!travar&&l)l.remove();
  });
  if(pageState==='gate-social')Celebrar.portao('social');
  if(pageState==='gate-rank')Celebrar.portao('rank');
}
document.addEventListener('click',e=>{const a=e.target.closest('.console-navigation a.nav-locked');if(a){e.preventDefault();Celebrar.portao(a.dataset.portao,true)}},true);
document.getElementById('stateSel').addEventListener('change',e=>{if(e.target.value==='tour'){e.target.value=pageState;Tour.ir(0);return}pageState=e.target.value;if(pageState==='data'||pageState==='stale'||pageState.startsWith('gate'))selected=5;Celebrar.fechar();render();aplicarPortoes()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,120)});

const qs=new URLSearchParams(location.search);
if(PROFILES[qs.get('perfil')])profileKey=qs.get('perfil');
if(qs.get('estado')==='tour')addEventListener('load',()=>setTimeout(()=>Tour.ir(0),250));
else if(STATES.some(([k])=>k===qs.get('estado')))pageState=qs.get('estado');
if(+qs.get('sel'))selected=+qs.get('sel');

applyTheme(); render();
</script>
