<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TrailUp — Entrada (celular)</title>
<link rel="stylesheet" href="assets/aparelho.css" />
<style>
  /* Paleta da marca, sem perfil (antes do login), igual ao v4/00-entrada */
  :root{
    --bg:#110b28; --surface:#1b123f; --border-strong:#644dcb;
    --text:#f4f3f7; --text-muted:rgba(244,243,247,.82); --accent:#9583e6;
  }
  .tela{background:var(--bg);color:var(--text)}
  .title-font{font-family:Georgia,"Times New Roman",serif}
  .cena{position:absolute;inset:0}
  .cena img{width:100%;height:100%;object-fit:cover}
  .cena::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,11,40,.08) 0%,rgba(17,11,40,.3) 45%,#110b28 80%)}

  .conteudo{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--topo) + 14px) 24px calc(var(--base) + 20px)}
  .marca{display:flex;align-items:center;justify-content:center;gap:10px}
  .marca img{width:36px;height:36px;object-fit:contain}
  .marca span{font-size:32px;font-weight:700}
  .espaco{flex:1}
  /* no celular, a frase e os botões ficam no terço de baixo, ao alcance do polegar */
  .frase{font-size:25px;line-height:1.3;text-align:center;margin:0 0 18px;font-weight:700}
  .acoes{display:flex;flex-direction:column;gap:12px}
  .btn{min-height:56px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1.2 Inter,system-ui,sans-serif;border:1px solid transparent;text-decoration:none;cursor:pointer;padding:0 16px}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-primario{background:var(--accent);color:#110b28}
  .btn-secundario{background:var(--surface);border-color:var(--border-strong);color:var(--accent);flex-direction:column;gap:2px;padding:8px 16px}
  .btn-secundario .linha1{display:flex;align-items:center;gap:8px}
  .btn-secundario small{font-size:12px;font-weight:500;color:var(--text-muted)}

  /* Bem-vindo(a) de volta: ~2s, quando já existe sessão */
  .volta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:var(--topo) 32px var(--base)}
  .volta h1{font-size:24px;margin:0;letter-spacing:.02em}
  .volta p{font-size:15px;line-height:1.5;color:var(--text-muted);margin:0}
  .anel{width:168px;height:168px;border-radius:12px;border:1px solid rgba(149,131,230,.45);display:grid;place-items:center;margin-top:8px}
  .anel img{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(149,131,230,.5))}
  @media (prefers-reduced-motion:no-preference){.anel img{animation:pulsa 2s ease-in-out infinite}}
  @keyframes pulsa{50%{filter:drop-shadow(0 0 28px rgba(149,131,230,.8));transform:scale(1.04)}}
</style>
</head>
<body class="mesa">

<div class="preview"><span>Estado:</span><select id="estado" aria-label="Estado da tela"></select></div>

<div class="aparelho">
  <div class="tela">
    <div class="cena" aria-hidden="true"><img src="assets/entry-world.webp" alt="" /></div>
    <div id="conteudo"></div>
  </div>
</div>

<script src="assets/aparelho.js"></script>
<script>
const ESTADOS=[['entrada','Entrada'],['volta','Bem-vindo(a) de volta (~2s)']];
const $=id=>document.getElementById(id);
function render(estado){
  $('estado').innerHTML=ESTADOS.map(([k,l])=>`<option value="${k}" ${estado===k?'selected':''}>${l}</option>`).join('');
  $('conteudo').innerHTML=estado==='volta'
    ?`<div class="volta" role="status">
        <h1 class="title-font">BEM VINDO(A) DE VOLTA!</h1>
        <p>Sentimos sua falta, ficamos felizes<br />que tenha voltado.</p>
        <div class="anel"><img src="assets/trailup-star.png" alt="" /></div></div>`
    :`<div class="conteudo">
        <div class="marca"><img src="assets/trailup-star.png" alt="" /><span class="title-font">TrailUp</span></div>
        <div class="espaco"></div>
        <h1 class="frase title-font">Sua próxima conquista começa aqui.</h1>
        <div class="acoes">
          <a class="btn btn-primario" href="01-login.html">Já tenho conta
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn btn-secundario" href="#" title="Abre o site do TrailUp no navegador">
            <span class="linha1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Criar conta ↗</span>
            <small>abre no navegador</small></a>
        </div></div>`;
}
$('estado').addEventListener('change',e=>{history.replaceState(null,'',location.pathname+'?estado='+e.target.value);render(e.target.value)});
render(new URLSearchParams(location.search).get('estado')||'entrada');
</script>
</body>
</html>
