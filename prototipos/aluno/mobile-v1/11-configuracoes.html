<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TrailUp — Configurações (celular)</title>
<link rel="stylesheet" href="assets/aparelho.css" />
<link rel="stylesheet" href="assets/app.css" />
<style>
  .topo{position:absolute;left:0;right:0;top:0;z-index:10;padding:var(--topo) 12px 0 4px;background:var(--bg)}
  .topo-linha{display:flex;align-items:center;gap:4px;height:56px}
  .voltar{width:48px;height:48px;display:grid;place-items:center;color:var(--text);flex:none;background:none;border:0;padding:0;cursor:pointer}
  .voltar svg{width:22px;height:22px}
  .topo-linha div{flex:1;min-width:0}
  .topo-linha h1{font-family:Georgia,serif;font-size:20px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topo.raiz{padding-left:18px}.topo.raiz h1{font-size:24px}
  .rolagem{position:absolute;left:0;right:0;top:calc(var(--topo) + 56px);bottom:calc(var(--abas) + var(--base));overflow-y:auto;scrollbar-width:none;padding:4px 14px 28px}
  .rolagem::-webkit-scrollbar{display:none}
  .rolagem.com-pe{padding-bottom:96px}
  .busca{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:6px}
  .busca svg{width:17px;height:17px;color:var(--text-subtle)}
  .busca input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:16px;outline:none}
  .grupo{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);margin:18px 6px 6px}
  .lista{border-radius:14px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
  .linha{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer}
  .linha:last-child{border-bottom:0}
  .linha .ic{width:32px;height:32px;border-radius:9px;background:var(--accent-muted);color:var(--accent);display:grid;place-items:center;flex:none}
  .linha .ic svg{width:17px;height:17px}
  .linha span.t{flex:1}
  .linha > svg{width:16px;height:16px;color:var(--text-subtle)}
  .linha.perigo{color:var(--danger)}.linha.perigo .ic{background:var(--danger-bg);color:var(--danger)}
  .desc{font-size:14.5px;line-height:1.55;color:var(--text-muted);margin:4px 4px 14px}
  .cartao{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:14px 16px;margin-bottom:12px}
  .cartao h4{margin:0 0 10px;font-size:14px}
  .caixa{border-radius:14px;background:var(--bg-a55);border:1px dashed var(--line);padding:14px 16px;margin-bottom:12px}
  .caixa h3{margin:0 0 6px;font-size:14.5px}
  .caixa p{margin:0 0 6px;font-size:13.5px;color:var(--text-muted);line-height:1.5}
  .caixa ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--text-muted);line-height:1.6}
  .caixa a{display:flex;justify-content:space-between;align-items:center;min-height:44px;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;border-top:1px solid var(--line)}
  .caixa a.perigo{color:var(--danger)}
  .medidor{display:flex;align-items:baseline;gap:6px;margin:4px 0 8px}
  .medidor b{font-family:Georgia,serif;font-size:30px}.medidor span{font-size:13px;color:var(--text-subtle)}
  .termo{font-size:12px;color:var(--text-subtle)}
  .sinal{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .sinal i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--text-subtle)}
  .sinal i.on{background:var(--success)}
  .sinal strong{display:block;font-size:13.5px}.sinal span{font-size:13px;color:var(--text-muted);line-height:1.45}
  .interr{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;cursor:pointer}
  .interr > svg{width:22px;height:22px;color:var(--accent);flex:none}
  .interr div{flex:1}
  .interr .tt{margin:0;font-size:15px;font-weight:700}
  .interr .ts{margin:2px 0 0;font-size:13px;color:var(--text-subtle);line-height:1.4}
  .interr .nega{margin:4px 0 0;font-size:12px;color:var(--warning)}
  .sw{width:52px;height:32px;border-radius:999px;background:var(--elev);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text-subtle);transition:transform .2s}
  .sw.on{background:var(--accent);border-color:var(--accent)}.sw.on::after{transform:translateX(20px);background:var(--bg)}
  .fld{display:block;margin-bottom:12px}
  .fld span{display:block;font-size:12.5px;font-weight:700;color:var(--text-subtle);margin-bottom:6px}
  .fld input,.fld textarea,.fld select{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg-a55);color:var(--text);padding:0 14px;font-size:16px;font-family:inherit}
  .fld input,.fld select{height:50px}.fld textarea{min-height:100px;padding:12px 14px;resize:vertical}
  .fld input[readonly]{opacity:.65}
  .fld.erro input{border-color:var(--danger)}.fld small{color:var(--danger);font-size:12.5px}
  .midia{display:flex;align-items:center;gap:12px}
  .midia img{width:56px;height:56px;border-radius:50%;object-fit:cover}
  .midia .btn{flex:1;font-size:13.5px;padding:0 10px}
  .pe{position:absolute;left:0;right:0;bottom:calc(var(--abas) + var(--base));z-index:12;padding:10px 14px;background:linear-gradient(transparent,var(--bg) 30%)}
  .feito{display:flex;gap:10px;padding:14px;border-radius:14px;background:var(--success-bg);border:1px solid rgba(98,219,155,.35);margin-bottom:12px}
  .feito svg{width:22px;height:22px;color:var(--success);flex:none}
  .feito strong{display:block;font-size:14.5px}.feito p{margin:2px 0 0;font-size:13.5px;color:var(--text-muted);line-height:1.5}
  .pilulas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pilulas button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg-a55);font-weight:700;font-size:14px}
  .pilulas button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .pilulas.off{opacity:.4;pointer-events:none}
  .kv{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}.kv span{color:var(--text-subtle)}.kv b{text-align:right}
  .nota{font-size:13px;color:var(--text-subtle);line-height:1.5;margin:4px 4px 12px}
  .opcoes{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .opc{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
  .opc .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:none;margin-top:1px}
  .opc.on{border-color:var(--accent);background:var(--accent-muted)}
  .opc.on .ck{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
  .opc strong{display:block;font-size:15px}.opc span{font-size:13px;color:var(--text-muted);line-height:1.45}
  .btn-perigo{background:var(--danger);color:#2a0d10}
  .veu{z-index:35}
  .folha{z-index:40;bottom:0;padding:0 18px calc(var(--base) + 18px)}
  .folha h3{font-family:Georgia,serif;font-size:20px;margin:2px 0 6px}
  .folha p{font-size:14.5px;color:var(--text-muted);margin:0 0 16px;line-height:1.5}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .aviso{position:absolute;left:12px;right:12px;bottom:calc(var(--abas) + var(--base) + 12px);z-index:45;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .aviso svg{width:20px;height:20px;flex:none}
  .aviso div{flex:1}.aviso strong{display:block;font-size:14px}.aviso span{font-size:12.5px;opacity:.85}
  .aviso .btn{min-height:40px;padding:0 12px;font-size:13px;background:var(--bg);color:var(--text)}
</style>
</head>

<script>
/* textos do v4 (11-configuracoes.html, revisão 04 #6) */

};
const GRUPOS=[
  ['Conta',[['info','Informações pessoais',I.pessoa],['senha','Resetar senha',I.chave]]],
  ['Privacidade e termos',[['coleta','Coleta e acessos',I.olho],['relatorio','Gerar relatório dos dados',I.doc],['privacidade','Política de privacidade',I.escudo],['excluir','Solicitar exclusão da conta',I.lixo,'perigo']]],

];
const GRUPO_DE={info:'Conta',senha:'Conta',coleta:'Privacidade e termos',privacidade:'Privacidade e termos',excluir:'Privacidade e termos',lembrete:'Preferências',aparencia:'Preferências',metricas:'Personalização visual',app:'Tutorial e informações do app'};
const TITULO={info:'Informações pessoais',senha:'Redefinir senha',coleta:'Coleta e acessos',privacidade:'Política de privacidade',excluir:'Solicitar exclusão da conta',lembrete:'Lembrete diário',aparencia:'Aparência',metricas:'Visualização das métricas',app:'Informações do app'};
const HORAS=[7,8,12,18,19,20,21,22];
const TEMAS=[['auto','Automático','Usa o perfil BrainHex dominante para escolher o visual mais adequado.'],['arena','Arena Tática','HUD competitivo com operação, ritmo, rank e status de missão.'],['metas','Metas','Painel focado em marcos, checklist, progresso e próximos objetivos.'],['misterio','Mistério','Transforma progresso em mapa, pistas, descobertas e exploração.'],['analitico','Painel Analítico','Leitura clara e direta do desempenho, atenção e evolução do aluno.'],['squad','Squad','Destaque para presença, ranking, conquistas e energia de grupo.']];
const ESTADOS=[['lista','Lista'],['coleta','Coleta e acessos'],['info','Informações pessoais'],['info-erro','Informações: nome vazio'],['senha','Resetar senha'],['senha-enviado','Senha: e-mail enviado'],['privacidade','Política de privacidade'],['excluir','Exclusão da conta'],['excluir-enviado','Exclusão: solicitação enviada'],['lembrete','Lembrete diário'],['lembrete-off','Lembrete desativado'],['aparencia','Aparência'],['metricas','Estilo das métricas'],['app','Informações do app'],['tutorial','Tutorial reiniciado']];
let estado, sub=null, busca='', st={}, folha=null, aviso=null;
const $=id=>document.getElementById(id);
const hh=h=>String(h).padStart(2,'0');
const caixa=(t,b)=>`<div class="caixa"><h3>${t}</h3>${b}</div>`;
function zera(){st={nome:'Amina Tavares',apelido:'amina.t',desc:'Gosto de desafios curtos e de ganhar da turma na arena.',erroNome:false,senha:'form',excluir:'form',motivo:'',lembrete:true,hora:19,tema:'auto',coleta:{cam:false,uso:true,desemp:true,chat:true}}}

const SUB={
  coleta:()=>{const c=st.coleta,n=Object.values(c).filter(Boolean).length,linha=(k,ic,t,s,extra='')=>`<div class="interr" data-coleta="${k}" role="switch" aria-checked="${c[k]}">${ic}<div><p class="tt">${t}</p><p class="ts">${s}</p>${extra}</div><span class="sw ${c[k]?'on':''}"></span></div>`;

    ${caixa('Seus dados','<a href="10-relatorio-dados.html">Gerar relatório dos dados <span>→</span></a><a href="#" data-vai="privacidade">Política de privacidade <span>→</span></a><a href="#" class="perigo" data-vai="excluir">Solicitar exclusão da conta <span>→</span></a>')}`},
  info:()=>`<p class="desc">Seu nome, apelido e descrição aparecem no seu perfil público para a turma.</p>

      <label class="fld"><span>Descrição</span><textarea id="f-desc" placeholder="Como você gosta de aprender, interesses, objetivos...">${st.desc}</textarea></label>
      <label class="fld"><span>Modo de operação</span><select><option>Guiado</option><option>Livre</option></select></label>
      <label class="fld"><span>Modo de resposta</span><select><option>imediato</option><option>ao final</option></select></label></div>
    ${caixa('Onde isso aparece','<p>Foto, banner, nome, apelido e descrição formam o seu perfil público: é o que os colegas veem ao tocar em você no Social.</p>')}${caixa('Modos de estudo','<p>Suas preferências de estudo são salvas e já entram no próximo ciclo do app.</p>')}`,
  senha:()=>`<p class="desc">Enviaremos um e-mail com as instruções para redefinir sua senha. Verifique sua caixa de entrada e siga o link recebido.</p>
    ${st.senha==='enviado'?`<div class="feito">${I.carta}<div><strong>E-mail enviado</strong><p>Se o e-mail estiver correto, você receberá um link para redefinir a senha. Verifique sua caixa de entrada ou spam.</p></div></div>`:''}

      <button class="btn btn-primario btn-bloco" data-senha ${st.senha==='enviado'?'disabled':''}>${st.senha==='enviado'?'Solicitação enviada':'Solicitar alteração'}</button></div>

  privacidade:()=>`<p class="desc">A política e os termos abrem no navegador do celular.</p>
    <div class="cartao"><p style="margin:0 0 14px;color:var(--text-muted);font-size:14px;line-height:1.55">A política explica quais dados a plataforma coleta, para que servem e por quanto tempo ficam guardados. O que você liga ou desliga em "Coleta e acessos" vale na hora.</p>
      <button class="btn btn-primario btn-bloco" data-aviso="Política de privacidade|Abrindo no navegador…">Abrir política de privacidade</button><button class="btn btn-secundario btn-bloco" style="margin-top:8px" data-aviso="Termos de uso|Abrindo no navegador…">Termos de uso</button></div>
    ${caixa('Seus dados','<a href="10-relatorio-dados.html">Gerar relatório dos dados <span>→</span></a><a href="#" data-vai="coleta">Coleta e acessos <span>→</span></a>')}`,
  excluir:()=>`<p class="desc">Informe o motivo e confirmaremos a exclusão dos seus dados. Você receberá um e-mail para prosseguir.</p>
    ${st.excluir==='enviado'?`<div class="feito">${I.ok}<div><strong>Solicitação enviada</strong><p>Registramos seu pedido de exclusão. Um e-mail de confirmação será enviado.</p></div></div>`
      :`<div class="cartao"><label class="fld"><span>Motivo</span><textarea id="f-motivo" placeholder="Descreva brevemente o motivo">${st.motivo}</textarea></label><button class="btn btn-perigo btn-bloco" data-excluir>Enviar solicitação</button></div>`}
    ${caixa('Antes de pedir','<p>A exclusão apaga seu progresso, conquistas, Bag e moedas em todas as turmas. Se quiser só parar a coleta de dados, use "Coleta e acessos".</p>')}${caixa('Seus dados','<a href="10-relatorio-dados.html">Gerar relatório dos dados <span>→</span></a>')}`,
  lembrete:()=>`<p class="desc">Escolha o horário em que o TrailUp te avisa para continuar a trilha. Funciona mesmo com o app fechado.</p>
    <div class="interr" data-lembrete role="switch" aria-checked="${st.lembrete}">${I.sino}<div><p class="tt">Lembrete diário</p><p class="ts">${st.lembrete?`Avisa todo dia às ${hh(st.hora)}:00`:'Desativado'}</p></div><span class="sw ${st.lembrete?'on':''}"></span></div>
    <div class="cartao"><h4>Horário</h4><div class="pilulas ${st.lembrete?'':'off'}">${HORAS.map(h=>`<button class="${h===st.hora?'on':''}" data-hora="${h}">${hh(h)}h</button>`).join('')}</div></div>
    ${caixa('Como chega','<p>O aviso aparece como notificação do celular e também em Notificações, como revisão diária. Um lembrete por dia.</p>')}`,
  aparencia:()=>`<p class="desc">Personalize a aparência do aplicativo.</p><div class="cartao"><div class="kv"><span>Perfil</span><b>Automático</b></div><div class="kv"><span>Animações</span><b>Ativadas</b></div><div class="kv"><span>Tamanho da fonte</span><b>Padrão</b></div></div>
    <p class="nota">Mais opções de aparência estarão disponíveis em breve.</p>${caixa('Perfil automático',`<p>As cores, as artes e o guia seguem o seu perfil BrainHex ativo (${PERFIS[perfil].label}). A troca de perfil fica no seu Perfil.</p>`)}`,
  metricas:()=>`<p class="desc">Esta configuração altera apenas a aparência e a organização do painel. Seus valores, progresso e histórico permanecem iguais.</p>
    <div class="opcoes" role="radiogroup">${TEMAS.map(([k,l,d])=>`<button class="opc ${st.tema===k?'on':''}" role="radio" aria-checked="${st.tema===k}" data-tema="${k}"><span class="ck"></span><span><strong>${l}</strong><span>${d}</span></span></button>`).join('')}</div>
    <p class="nota"><b style="color:var(--text)">Automático ou estilo fixo.</b> Automático acompanha o perfil BrainHex ativo. Escolher outro estilo fixa aquela visualização neste aparelho até você mudar novamente.</p>`,
  app:()=>`<p class="desc">TrailUp ajuda você a acompanhar sua trilha de aprendizado, módulos, atividades e conquistas em um só lugar. Aqui estão alguns detalhes técnicos e de produto.</p>
    <div class="cartao"><div class="kv"><span>Nome</span><b>TrailUp</b></div><div class="kv"><span>Descrição</span><b style="max-width:62%;font-weight:500;font-size:13px;line-height:1.45">Plataforma para gerenciar trilhas, módulos, conteúdos e gamificação (ranking, eventos e conquistas).</b></div><div class="kv"><span>Autor / Organização</span><b>BitStudioLabs</b></div></div>
    ${caixa('Informação de versão','<div class="kv"><span>Versão</span><b>1.0.4</b></div><div class="kv"><span>Versão do build</span><b>android · 2026.10</b></div>')}`,
};
function listaHTML(){
  const q=busca.trim().toLowerCase();
  const G=GRUPOS.map(([g,L])=>[g,L.filter(([,t])=>!q||t.toLowerCase().includes(q))]).filter(([,L])=>L.length);
  return `<label class="busca">${I.busca}<input id="busca" placeholder="Pesquisar" value="${busca}" aria-label="Pesquisar nas configurações" /></label>
    ${G.map(([g,L])=>`<div class="grupo">${g}</div><div class="lista">${L.map(([k,t,ic,cls])=>k==='relatorio'?`<a class="linha" href="10-relatorio-dados.html"><span class="ic">${ic}</span><span class="t">${t}</span>${ICONE.chev}</a>`
      :`<button class="linha ${cls||''}" data-sub="${k}"><span class="ic">${ic}</span><span class="t">${t}</span>${cls?'':ICONE.chev}</button>`).join('')}</div>`).join('')}
    ${!q||'sair deste aparelho'.includes(q)?`<div class="lista" style="margin-top:18px"><button class="linha perigo" data-sair><span class="ic">${I.sair}</span><span class="t">Sair deste aparelho</span></button></div>`:''}`;
}
function render(){
  aplicarTema();
  $('preview').innerHTML=previewHTML(ESTADOS,estado);
  let h;
  if(!sub){h=`<header class="topo"><div class="topo-linha"><a class="voltar" href="08-perfil-hub.html" aria-label="Voltar para o Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="eyebrow">Perfil</div><h1>Configurações</h1></div></div></header><div class="rolagem" id="rolagem">${listaHTML()}</div>`}
  else{h=`<header class="topo"><div class="topo-linha"><button class="voltar" data-volta aria-label="Voltar para as Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button><div><div class="eyebrow">${GRUPO_DE[sub]}</div><h1>${TITULO[sub]}</h1></div></div></header>
    <div class="rolagem ${sub==='info'?'com-pe':''}" id="rolagem">${SUB[sub]()}</div>${sub==='info'?'<div class="pe"><button class="btn btn-primario btn-bloco" data-salva>Salvar alterações</button></div>':''}`}
  h+=abasHTML('perfil');
  if(folha==='senha')h+=`<div class="veu" data-fecha></div><section class="folha vidro" role="dialog" aria-modal="true" aria-labelledby="ft"><span class="alca" data-fecha></span><h3 id="ft">Confirmar solicitação</h3><p>Vamos enviar o link de redefinição para amina.tavares@escola.edu.br.</p><div class="duas"><button class="btn btn-secundario" data-fecha>Cancelar</button><button class="btn btn-primario" data-senha-ok>Confirmar</button></div></section>`;
  if(aviso)h+=`<div class="aviso" role="status">${I.ok}<div><strong>${aviso[0]}</strong><span>${aviso[1]}</span></div>${aviso[2]||''}</div>`;
  const stt=$('rolagem')?.scrollTop||0, foco=document.activeElement?.id;
  $('tela').innerHTML=h;
  if($('rolagem'))$('rolagem').scrollTop=stt;
  if(foco==='busca'){const b=$('busca');b.focus();b.setSelectionRange(b.value.length,b.value.length)}
}
function avisa(t,d,acao,ms=3000){aviso=[t,d,acao];render();clearTimeout(avisa.t);avisa.t=setTimeout(()=>{aviso=null;render()},ms)}
const ABRIR_TOUR='<a class="btn" href="03-trilha.html">Abrir agora</a>';
function define(v){
  estado=v;zera();folha=null;aviso=null;busca='';
  const [k,x]=v.split('-');
  if(v==='lista'){sub=null;render();return}
  if(v==='tutorial'){sub=null;render();avisa('Tutorial reiniciado','Ele aparece de novo na próxima vez que você abrir a Trilha.',ABRIR_TOUR,8000);return}
  if(x==='erro'){st.nome='';st.erroNome=true}
  if(x==='enviado')st[k]='enviado';
  if(v==='lembrete-off')st.lembrete=false;
  sub=k;render();
}
document.addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;render()}if(e.target.id==='f-nome')st.nome=e.target.value;if(e.target.id==='f-desc')st.desc=e.target.value;if(e.target.id==='f-motivo')st.motivo=e.target.value});
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  if(q('[data-perfil]')){perfil=q('[data-perfil]').dataset.perfil;render();return}
  if(q('[data-sub]')){const k=q('[data-sub]').dataset.sub;if(k==='tutorial'){avisa('Tutorial reiniciado','Ele aparece de novo na próxima vez que você abrir a Trilha.',ABRIR_TOUR,8000);return}sub=k;render();$('rolagem').scrollTop=0;return}
  if(q('[data-vai]')){e.preventDefault();sub=q('[data-vai]').dataset.vai;render();$('rolagem').scrollTop=0;return}
  if(q('[data-volta]')){sub=null;render();return}
  if(q('[data-sair]')){avisa('Você saiu deste aparelho','Voltando para a entrada…');setTimeout(()=>location.href='00-entrada.html',1200);return}
  if(q('[data-coleta]')){const k=q('[data-coleta]').dataset.coleta;st.coleta[k]=!st.coleta[k];render();return}
  if(q('[data-lembrete]')){st.lembrete=!st.lembrete;render();return}
  if(q('[data-hora]')){st.hora=+q('[data-hora]').dataset.hora;render();return}
  if(q('[data-tema]')){st.tema=q('[data-tema]').dataset.tema;render();return}
  if(q('[data-aviso]')){const [t,d]=q('[data-aviso]').dataset.aviso.split('|');avisa(t,d);return}
  if(q('[data-salva]')){st.erroNome=!st.nome.trim();render();if(!st.erroNome)avisa('Perfil atualizado','Suas preferências de estudo foram salvas e já entram no próximo ciclo do app.');return}
  if(q('[data-senha]')){folha='senha';render();return}
  if(q('[data-senha-ok]')){folha=null;st.senha='enviado';render();return}
  if(q('[data-fecha]')){folha=null;render();return}
  if(q('[data-excluir]')){st.excluir='enviado';render();return}
});
document.addEventListener('change',e=>{if(e.target.id!=='estado')return;history.replaceState(null,'',`${location.pathname}?estado=${e.target.value}&perfil=${perfil}`);define(e.target.value)});
define(qs.get('estado')||(location.hash==='#informacoes'?'info':'lista'));
</script>
</body>
</html>
