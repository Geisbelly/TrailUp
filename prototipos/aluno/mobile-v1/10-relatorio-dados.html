<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TrailUp — Relatório dos seus dados (celular)</title>
<link rel="stylesheet" href="assets/aparelho.css" />
<link rel="stylesheet" href="assets/app.css" />
<style>
  .topo{position:absolute;left:0;right:0;top:0;z-index:10;padding:var(--topo) 12px 0 4px;background:var(--bg)}
  .topo-linha{display:flex;align-items:center;gap:4px;height:56px}
  .voltar{width:48px;height:48px;display:grid;place-items:center;color:var(--text)}
  .voltar svg{width:22px;height:22px}
  .topo-linha h1{font-family:Georgia,serif;font-size:20px;margin:2px 0 0}
  .rolagem{position:absolute;left:0;right:0;top:calc(var(--topo) + 56px);bottom:calc(var(--abas) + var(--base));overflow-y:auto;scrollbar-width:none;padding:6px 14px 28px;display:flex;flex-direction:column;gap:14px}
  .cartao{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:16px}
  .cartao h2{font-family:Georgia,serif;font-size:18px;margin:0 0 10px}
  .item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px;color:var(--text-muted);line-height:1.45;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:1px}
  .acao p{font-size:14.5px;color:var(--text-muted);margin:0 0 12px;line-height:1.5}
  .gira{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:var(--bg);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .erro{margin-top:12px;display:flex;gap:10px;padding:14px;border-radius:12px;background:var(--danger-bg);border:1px solid var(--danger-border)}
  .erro svg{width:20px;height:20px;color:var(--danger);flex:none}
  .erro strong{display:block;font-size:14.5px;margin-bottom:4px}
  .erro p{margin:0 0 10px;font-size:13.5px;color:#f3d9e0;line-height:1.5}
  .previa h3{margin:0 0 10px;font-size:15px}
  .doc{background:#f6f1e6;border-radius:6px;padding:16px;color:#2a2416;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .doc .cab{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-bottom:10px}
  .doc i{display:block;height:7px;border-radius:4px;background:#d9cfb9;margin:7px 0}
  .doc i.curta{width:60%}
  .doc span{display:inline-block;margin:10px 6px 0 0;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e8dfca}
  .veu{z-index:35}
  .partilha{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#1c1c1e;color:#fff;border-radius:16px 16px 0 0;padding:10px 16px calc(var(--base) + 16px);font-family:system-ui,sans-serif}
  .partilha .arq{display:flex;align-items:center;gap:10px;padding:8px 0 14px;border-bottom:1px solid #ffffff22}
  .partilha .arq b{display:block;font-size:14px}.partilha .arq small{color:#aaa;font-size:12px}
  .partilha .pdf{width:40px;height:48px;border-radius:4px;background:#e5484d;display:grid;place-items:center;font-size:11px;font-weight:800}
  .partilha .apps{display:flex;gap:18px;padding:16px 4px;overflow-x:auto}
  .partilha .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#ddd;flex:none}
  .partilha .app i{width:54px;height:54px;border-radius:14px;display:block}
  .partilha button{width:100%;min-height:48px;border-radius:12px;border:0;background:#2c2c2e;color:#0a84ff;font-size:16px;font-weight:600}
</style>
</head>
<body class="mesa">

<div class="preview" id="preview"></div>

<div class="aparelho">
  <div class="tela" id="tela"></div>
</div>

<script src="assets/aparelho.js"></script>
<script src="assets/tema.js"></script>
<script src="assets/tour.js"></script>
<script>
const ESTADOS=[['pronto','Pronto'],['gerando','Gerando...'],['erro','Erro ao gerar (#28)'],['partilha','Compartilhar']];
const PDF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>';
let estado;
const $=id=>document.getElementById(id);
function render(){
  aplicarTema();
  $('preview').innerHTML=previewHTML(ESTADOS,estado);
  const gerando=estado==='gerando';
  let h=`<header class="topo"><div class="topo-linha"><a class="voltar" href="08-perfil-hub.html" aria-label="Voltar para o Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="eyebrow">Perfil</div><h1>Relatório dos seus dados</h1></div></div></header>
    <div class="rolagem">
      <section class="cartao"><h2>O que entra no relatório</h2>
        <div class="item">${ICONE.check}<span>Eventos de estudo e pontuação registrados durante suas sessões</span></div>
        <div class="item">${ICONE.check}<span>Suas posições em rankings da turma</span></div>
        <div class="item">${ICONE.check}<span>Conquistas desbloqueadas e seu progresso</span></div></section>
      <section class="cartao acao"><p>Gere um PDF com tudo isso pra guardar ou compartilhar quando quiser.</p>
        <button class="btn btn-primario btn-bloco" data-gera ${gerando?'disabled aria-busy="true"':''}>${gerando?'<span class="gira"></span>Gerando o PDF...':`${PDF}Gerar e compartilhar o PDF`}</button>
        ${estado==='erro'?`<div class="erro" role="alert">${ICONE.alerta}<div><strong>Não foi possível gerar o relatório agora</strong><p>Isso pode acontecer por instabilidade momentânea. Tente novamente — se persistir, procure seu professor ou a coordenação.</p><button class="btn btn-secundario" data-gera>${ICONE.repetir}Tentar novamente</button></div></div>`:''}</section>
      <section class="cartao previa"><h3>Prévia do PDF</h3><div class="doc"><div class="cab">Relatório TrailUp — Amina T.</div><i></i><i></i><i class="curta"></i><i style="margin-top:14px"></i><i></i><i class="curta"></i><span>42 eventos</span><span>12º no rank</span></div></section>
    </div>`+abasHTML('perfil');
  if(estado==='partilha')h+=`<div class="veu" data-fecha></div><section class="partilha" role="dialog" aria-label="Compartilhar"><div class="arq"><span class="pdf">PDF</span><div><b>Relatório TrailUp — Amina T.pdf</b><small>184 KB</small></div></div>
    <div class="apps">${[['#25d366','WhatsApp'],['#0a84ff','E-mail'],['#4285f4','Drive'],['#8e8e93','Arquivos']].map(([c,l])=>`<span class="app"><i style="background:${c}"></i>${l}</span>`).join('')}</div><button data-fecha>Cancelar</button></section>`;
  $('tela').innerHTML=h;
}
function define(v){estado=v;render()}
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  if(q('[data-perfil]')){perfil=q('[data-perfil]').dataset.perfil;render();return}
  if(q('[data-gera]')){define('gerando');setTimeout(()=>define('partilha'),1100);return}
  if(q('[data-fecha]')){define('pronto');return}
});
document.addEventListener('change',e=>{if(e.target.id!=='estado')return;history.replaceState(null,'',`${location.pathname}?estado=${e.target.value}&perfil=${perfil}`);define(e.target.value)});
define(qs.get('estado')||'pronto');
</script>
</body>
</html>
