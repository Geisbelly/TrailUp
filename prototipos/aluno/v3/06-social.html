<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrailUp — Social (Conqueror)</title>
<style>
  :root{
    --bg:#0b1328; --surface:#121e3f; --elevated:#192a57;
    --border:#28428a; --border-strong:#4d6fcb;
    --text:#f3f4f7; --text-muted:rgba(243,244,247,.82); --text-subtle:rgba(243,244,247,.62);
    --accent:#6f90eb; --success:#3fbf6b; --danger:#e15b64;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .title-font{font-family:Georgia,"Times New Roman",serif}
  /* Estrutura identica ao console-shell do professor (ConsoleShell.tsx / page-surfaces.css) */
  .console-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:68px minmax(0,1fr);height:100vh;overflow:hidden}
  .console-topbar{grid-column:1/-1;display:flex;align-items:center;gap:28px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
  .journey-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-size:20px}
  .journey-brand img{width:32px;height:32px}
  .journey-brand span{font-family:Georgia,serif;font-weight:700}
  .console-workspace-name{color:var(--text-subtle);font-size:12px}
  .console-account{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .console-account img.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
  .console-account-copy{display:grid;gap:2px}
  .console-account-copy strong{font-size:13px;font-weight:600}
  .console-account-copy span{font-size:11px;color:var(--text-subtle)}
  .console-icon-button{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;color:var(--text-muted);background:none;border:none;cursor:pointer;flex:none}
  .console-icon-button:hover{color:var(--text);background:var(--elevated)}
  .console-icon-button img{width:20px;height:20px}
  .console-icon-button svg{width:18px;height:18px}
  .console-navigation{padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:rgba(0,0,0,.15);overflow-y:auto}
  .console-navigation a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:6px;border:1px solid transparent;color:var(--text-muted);font-size:13px;text-decoration:none}
  .console-navigation a svg{flex:none;width:18px;height:18px}
  .console-navigation a:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .console-navigation a[aria-current="page"]{color:var(--text);background:rgba(111,144,235,.13);border-color:var(--border-strong)}
  .console-navigation a[aria-current="page"] svg{color:var(--accent)}
  .console-navigation .nb{margin-left:auto;background:var(--accent);color:var(--bg);font-size:10px;font-weight:800;padding:1px 6px;border-radius:100px}
  .console-main{grid-column:2;grid-row:2;overflow-y:auto;position:relative}

  /* cabeçalho, chips, pílulas e seletor: os mesmos da tela de Notificações */
  .wrap{padding:28px 32px 48px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
  h1{font-family:Georgia,serif;font-size:28px;margin:0}
  .sub{font-size:14px;color:var(--text-subtle);margin:6px 0 0}
  .page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
  .page-head .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;font-size:12.5px;font-weight:600;background:var(--elevated);color:var(--text-muted);white-space:nowrap}
  .chip img{width:20px;height:20px}
  .chip-accent{background:rgba(111,144,235,.16);color:var(--accent)}
  .icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);cursor:pointer}
  .icon-btn svg{width:17px;height:17px}
  a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .filters{display:flex;gap:8px;margin-bottom:18px}
  .filter{padding:8px 16px;border-radius:100px;border:1px solid var(--border-strong);font-size:13px;color:var(--text-muted);text-decoration:none;display:inline-flex;gap:7px;align-items:center}
  .filter:hover{background:var(--elevated);color:var(--text)}
  .filter .n{font-size:11.5px;font-weight:700;opacity:.8}
  .preview{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:100px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--text-muted)}
  .preview select{background:var(--accent);color:var(--bg);border:0;border-radius:100px;padding:6px 10px;font-weight:600;font-family:inherit}

  /* 8/12 + 4/12: a coluna lateral é um card sticky encostado na borda direita, sem faixa vazia */
  .md{display:grid;grid-template-columns:8fr 4fr;gap:20px;align-items:start}
  .main-col{min-width:0}
  .block-title{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:28px 0 12px;scroll-margin-top:16px}
  .block-title .chip{font-size:11px;padding:2px 9px;letter-spacing:0}

  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:46px}
  .search svg{width:18px;height:18px;color:var(--text-subtle)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit}

  .invite-card{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--elevated);border:1px solid var(--accent);border-radius:12px;padding:14px 16px}
  .invite-card .pc-actions{flex:none}
  .grid-people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .person-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .pc-top{display:flex;align-items:center;gap:10px}
  .avatar{position:relative;width:44px;height:44px;flex-shrink:0}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--border-strong)}
  .online-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}
  .p-info{flex:1;min-width:0}
  .p-name{font-size:14px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-sub{font-size:12px;color:var(--text-subtle);margin:2px 0 0}
  .pc-actions{display:flex;gap:8px;align-items:center}
  .pill-btn{flex:1;text-align:center;padding:8px 12px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .pill-btn.primary{background:var(--accent);color:#0b1328}
  .pill-btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text-muted)}
  .pill-btn.ghost-wide{flex:none;background:transparent;border-color:var(--border-strong);color:var(--text)}
  .pill-btn.ghost-wide:disabled{opacity:.5;cursor:not-allowed}
  .pill-btn.accept{flex:none;background:var(--success);color:#0b1328}
  .pill-btn.decline{flex:none;background:transparent;border-color:var(--danger);color:var(--danger)}
  .pill-btn.danger{flex:none;background:var(--danger);color:#fff}
  .pill-btn.chat{flex:none;width:38px;padding:8px 0;background:var(--elevated);border-color:var(--border-strong);color:var(--accent)}
  .pill-btn.small{flex:none;padding:6px 10px;font-size:11px;background:transparent;border-color:var(--border-strong);color:var(--text)}
  .pill-btn svg{width:16px;height:16px}
  .chip.sent{flex:1;justify-content:center;padding:8px 12px}
  .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;margin-top:12px;display:inline-flex;align-items:center;gap:4px;font-family:inherit;padding:0}
  .link svg{width:14px;height:14px}
  .empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;padding:26px;color:var(--text-subtle);font-size:13.5px}
  .empty svg{width:36px;height:36px}
  .empty p{margin:0}
  .empty strong{color:var(--text)}

  .rail{position:sticky;top:28px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px}
  .rail h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 14px;scroll-margin-top:16px}
  .guild-card{background:var(--elevated);border:1px solid var(--border-strong);border-radius:14px;padding:18px;margin-bottom:24px;text-align:center}
  .guild-card img{width:52px;height:52px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(111,144,235,.4))}
  .guild-card h4{font-family:Georgia,serif;font-size:16px;margin:0 0 4px}
  .guild-card p{font-size:12px;color:var(--text-muted);margin:0 0 12px;line-height:1.4}
  .guild-card .members{display:flex;justify-content:center;margin-bottom:14px}
  .guild-card .members img{width:28px;height:28px;border-radius:50%;border:2px solid var(--elevated);margin-left:-8px;filter:none;margin-bottom:0}
  .guild-btn{width:100%;padding:10px;border-radius:8px;background:var(--accent);color:#0b1328;font-size:12px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
  .stat-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 8px;margin:0 -8px;border-radius:8px;border:0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;color:var(--text);text-decoration:none;background:none;cursor:pointer;font-family:inherit;box-sizing:content-box}
  .stat-row:hover{background:var(--elevated)}
  .stat-row span:last-child{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .stat-row svg{width:14px;height:14px}
  .guild-row{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid rgba(255,255,255,.06)}
  .guild-row img{width:32px;height:32px;object-fit:contain}
  .guild-row div{flex:1;min-width:0}
  .guild-row strong{display:block;font-size:13px}
  .guild-row div span{font-size:11.5px;color:var(--text-subtle)}
  .help{font-size:11.5px;color:var(--text-subtle);margin:6px 0 0;text-align:center}

  .error{grid-column:1/-1;display:flex;gap:14px;align-items:center;background:rgba(225,91,100,.1);border:1px solid rgba(225,91,100,.5);border-radius:16px;padding:18px 20px}
  .error svg{width:22px;height:22px;color:var(--danger);flex:none}
  .error p{margin:0;flex:1}
  .skel{border-radius:12px;background:linear-gradient(90deg,var(--surface),var(--elevated),var(--surface));background-size:200% 100%;animation:sh 1.3s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50}
  .modal{width:420px;background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;padding:22px 24px}
  .modal h3{margin:0 0 8px;font-size:17px}
  .modal p{margin:0 0 18px;color:var(--text-muted);font-size:14px;line-height:1.5}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end}

  /* ---------- v3: o Social como hub (evento, arena, batalhas) ---------- */
  .chip-ok{background:rgba(63,191,107,.16);color:#7fe0a3}
  .chip img{width:16px;height:16px;object-fit:contain}
  .bar{height:6px;border-radius:999px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong,#1942b2),var(--accent))}
  .eyebrow-sm,.ar-label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);font-weight:600;margin-bottom:8px}
  .event{padding:22px 24px;border-radius:16px;border:1px solid var(--accent);background:linear-gradient(160deg,var(--elevated),var(--surface));scroll-margin-top:16px}
  .ev-top{display:flex;align-items:center;gap:10px}
  .ev-scope{font-size:12.5px;color:var(--text-subtle)}
  .event h2{font-family:Georgia,serif;font-size:22px;margin:10px 0 4px}
  .ev-desc{font-size:13.5px;color:var(--text-muted);margin:0 0 12px;line-height:1.5}
  .ev-mode{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ev-mode small{font-size:12px;color:var(--text-subtle)}
  .ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .ev-grid > div{background:rgba(11,19,40,.55);border-radius:12px;padding:12px 14px}
  .ev-grid span{display:block;font-size:12px;color:var(--text-subtle)}
  .ev-grid b{display:block;font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
  .ev-grid small{display:block;font-size:11px;color:var(--text-subtle);margin-top:6px}
  .ev-foot{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
  .ev-foot p{flex:1;margin:0;font-size:12.5px;color:var(--text-muted)}
  .ev-foot .pill-btn{flex:none;padding:9px 16px}
  .ev-foot .pill-btn svg{width:14px;height:14px}
  .ev-empty{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:16px;border:1px dashed var(--border-strong);background:var(--surface)}
  .ev-empty svg{width:30px;height:30px;color:var(--text-subtle);flex:none}
  .ev-empty strong{display:block;font-size:14px}
  .ev-empty span{font-size:12.5px;color:var(--text-subtle)}

  .arena{position:relative;overflow:hidden;margin-top:20px;padding:22px 24px;border-radius:16px;border:1px solid var(--border);background:var(--bg);scroll-margin-top:16px}
  .ar-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
  .arena::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,19,40,.35),var(--bg) 92%);z-index:1}
  .arena > *:not(.ar-bg){position:relative;z-index:2}
  .ar-head{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .ar-head h2{font-family:Georgia,serif;font-size:22px;margin:0}
  .ar-head .chips{display:flex;gap:6px}
  .ar-body{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:18px}
  .ar-match{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:rgba(18,30,63,.88);border:1px solid var(--border)}
  .vs{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vs > div{display:flex;flex-direction:column;align-items:center;gap:6px;width:90px;text-align:center;font-size:13px}
  .vs img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border-strong)}
  .vs > div:first-child img{border-color:var(--accent)}
  .score{font-family:Georgia,serif;font-size:32px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score em{font-style:normal;color:var(--text-subtle);font-size:22px;margin:0 4px}
  .ar-win{color:#7fe0a3}
  .ar-status{margin:0;text-align:center;font-size:12.5px;font-weight:700;color:#7fe0a3}
  .ar-match small{font-size:12px;color:var(--text-subtle);text-align:center}
  .ar-match .pill-btn{flex:none;padding:10px 16px}
  .ar-out p{margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.5}
  .ar-table ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .ar-table li{display:grid;grid-template-columns:30px 28px 1fr auto;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:10px;background:rgba(18,30,63,.7);font-size:13px}
  .ar-table li b{color:var(--text-muted)}
  .ar-table li img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .ar-table li em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
  .ar-table li.me{background:rgba(111,144,235,.2);border:1px solid var(--accent)}
  .ar-rules{font-size:12px;color:var(--text-subtle);margin:14px 0 0;line-height:1.5}

  .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-align:left;cursor:pointer;font-family:inherit}
  .mode:hover{border-color:var(--accent)}
  .mode strong{font-size:14px}
  .mode small{font-size:12px;color:var(--text-subtle);line-height:1.4}
  .ch-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(111,144,235,.16);color:var(--accent);flex:none}
  .ch-ic svg{width:18px;height:18px}
  .sub-title{font-size:13px;margin:18px 0 8px;color:var(--text-muted)}
  .ch-list{display:flex;flex-direction:column;gap:8px}
  .ch-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
  .ch-row.recebido{border-color:var(--accent)}
  .ch-row.encerrado{opacity:.75}
  .ch-row p{flex:1;margin:0;font-size:13.5px}
  .ch-row .pc-actions .pill-btn{flex:none;padding:8px 14px}
  .toast{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 16px;border-radius:12px;border:1px solid var(--accent);background:rgba(111,144,235,.14)}
  .toast svg{width:18px;height:18px;color:var(--accent)}
  .toast span{flex:1;font-size:14px}
  .toast .pill-btn{flex:none}
  .pill-btn.ghost svg{width:14px;height:14px}
  .pill-btn.more{width:34px}

  .online{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .online img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--success)}
  .online span{font-size:12.5px;color:var(--text-muted);margin-left:6px}
  .g-rank{display:grid;grid-template-columns:24px 28px 1fr auto;align-items:center;gap:8px;min-height:40px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
  .g-rank span{color:var(--text-muted);font-weight:700}
  .g-rank img{width:26px;height:26px;object-fit:contain}
  .g-rank.me strong{color:var(--accent)}
  .g-rank .chip{font-style:normal;font-size:10.5px;padding:2px 8px}

  .m-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .m-head h3{margin:0}
  .m-head p{margin:2px 0 0!important}
  .picks{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:180px;overflow:auto}
  .pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);font-size:13.5px;cursor:pointer}
  .pick img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .pick em{margin-left:auto;font-style:normal;font-size:11px;color:#7fe0a3}
  .sel{width:100%;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 10px;font-family:inherit;margin-bottom:8px}

  /* barras de rolagem no tema (revisão 03): finas, na cor da borda do perfil, sem a barra cinza do sistema */
  *{scrollbar-width:thin;scrollbar-color:var(--border-strong,#4d6fcb) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-strong,#4d6fcb);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent,#6f90eb);background-clip:padding-box;border:3px solid transparent}
  ::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<div class="console-shell">
  <header class="console-topbar">
    <a class="journey-brand" href="03-trilha.html"><img src="assets/trailup-brand-logo.png" alt="" /><span>TrailUp</span></a>
    <span class="console-workspace-name">Área do aluno</span>
    <div class="console-account">
      <a href="08-perfil-hub.html" title="Meu perfil" aria-label="Meu perfil" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
        <img class="avatar" src="assets/rosto-conqueror.png" alt="" />
        <div class="console-account-copy"><strong>Amina T.</strong><span>Conqueror</span></div>
      </a>

function principal(){

    :pessoas.map((a,i)=>`<label class="pick"><input type="radio" name="alvo" ${quem?a.n===quem?'checked':'':i===0?'checked':''} /><img src="assets/rosto-${a.p}.png" alt="" />${esc(a.n)}<em>online</em></label>`).join('');
  abrirModal(`<div class="m-head"><span class="ch-ic">${I[modo]}</span><div><h3>${M[1]}</h3><p>${M[2]}</p></div></div>
    <span class="ar-label">${modo==='todos'?'Quem participa':modo==='duplo'?'Sua dupla':'Com quem'}</span><div class="picks">${alvo}</div>
    <span class="ar-label">Tópico</span><select class="sel" aria-label="Tópico do desafio"><option>Equações do 1º grau</option><option>Expressões algébricas</option><option>Frações</option></select>
    <p class="help" style="text-align:left">3 questões. Só aparecem tópicos que vocês dois já liberaram na trilha.</p>
    <div class="actions"><button class="pill-btn ghost-wide" data-close>Cancelar</button><button class="pill-btn primary" data-launch="${modo}">Lançar desafio</button></div>`);
}
document.addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;render()}});
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  if(e.target.classList.contains('modal-bg')||q('[data-close].pill-btn')){abrirModal('');return}
  if(q('[data-launch]')){const m=q('[data-launch]').dataset.launch,M=MODOS.find(x=>x[0]===m);abertos.unshift({id:Date.now(),modo:m,txt:`Você lançou um desafio · ${M[1]} · aguardando resposta`,st:'andamento'});abrirModal('');render();document.getElementById('batalhas').scrollIntoView({behavior:'smooth'});return}
  if(q('[data-mode]')){lancar(q('[data-mode]').dataset.mode);return}
  if(q('[data-duel]')){lancar('duelo',q('[data-duel]').dataset.duel);return}
  if(q('[data-acc]')){const a=abertos.find(x=>x.id===1);if(a){a.st='andamento';a.txt='Duelo com <strong>Diego A.</strong> · 3 questões de Equações · sua vez';}aviso=null;render();return}
  if(q('[data-rej]')){abertos=abertos.filter(x=>x.id!==+q('[data-rej]').dataset.rej);aviso=null;render();return}
  if(q('[data-cont]')||q('[data-round]')){abrirModal(`<h3>Rodada de questões</h3><p>Aqui abre a rodada: 3 questões de Equações do 1º grau, as mesmas para os dois lados. Vence quem acertar mais; o tempo só desempata.</p><div class="actions"><button class="pill-btn ghost-wide" data-close>Fechar</button></div>`);return}
  if(q('[data-join]')){naArena=true;render();return}
  if(q('[data-confirm-undo]')){const n=q('[data-confirm-undo]').dataset.confirmUndo;amigos=amigos.filter(a=>a.n!==n);abrirModal('');render();return}
  if(q('[data-undo]')){const n=q('[data-undo]').dataset.undo;abrirModal(`<h3>${n}</h3><p>Desfazer a amizade faz vocês deixarem de acompanhar o avanço um do outro. Dá para convidar de novo depois.</p><div class="actions"><button class="pill-btn ghost-wide" data-close>Manter amizade</button><button class="pill-btn danger" data-confirm-undo="${n}">Desfazer amizade</button></div>`);return}
  if(q('[data-blocked]')){abrirModal(`<h3>Pessoas bloqueadas</h3><p>Você não bloqueou ninguém.</p><div class="actions"><button class="pill-btn ghost-wide" data-close>Fechar</button></div>`);return}
  if(q('[data-inv]')){if(q('[data-inv]').dataset.inv==='ok')amigos.unshift({n:'Kwame R.',p:'achiever',s:'online agora',on:true});convite=false;render();return}
  if(q('[data-invite]')){colegas[+q('[data-invite]').dataset.invite].env=true;render();return}
  if(q('[data-all]')){verTodos=true;render();return}
  if(q('[data-clear]')){busca='';render();return}
  if(q('[data-retry]')){set('data');return}
  const a=q('a[href^="#"]');if(a&&a.getAttribute('href').length>1){const t=document.querySelector(a.getAttribute('href'));if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'})}}
});
document.getElementById('stateSel').addEventListener('change',e=>{history.replaceState(null,'',location.pathname+'?estado='+e.target.value);set(e.target.value)});
set(new URLSearchParams(location.search).get('estado')||'data');
</script>
</body>
</html>
